/* A racer as one line of text, a string a person can copy:

       SpecialDreamer-SpecialWeek-UMA2-eyJ2IjoxLCJjIjoxMDAxMDIs...

   The first two fields are the card's title and the character's name, punctuation stripped and
   each cut to sixteen characters, so a code sitting in a note or a message says who it is for.
   They are decoration: nothing reads them back, and the card id inside the payload is what
   names the racer, so a code whose label has been edited still loads as whoever it holds.
   `UMA2` says what the string is and which layout it is in, so a paste that is not one, or is
   a later one, is refused rather than half-read. `UMA1` is the same payload without the
   compression and is still read, so codes written before this are not lost. The payload is
   base64 over an alphabet with no dash in it — plus and slash become dot and underscore —
   which is what lets the fields be split on dashes however many the label has.

   What travels is the racer: who it is, its star rating, its five stats, its ten aptitudes, its
   running style and its skills. Not where it came from — a code carries no trainee id, no
   trainer, no date, no support cards — because a racer written by hand has none of that.

   The JSON is deflated before it is base64'd, with `CompressionStream('deflate-raw')` — the
   browser's own DEFLATE with no gzip or zlib wrapper around it. Nothing is lost — the same JSON
   comes back out — and a browser without the stream writes UMA1 instead, which every reader
   still takes.

   Under the compression the payload is JSON, minified, with one-letter keys. Skills are ids, or
   [id, level] for the few that are not at level 1. A reader keeps unknown keys out of its way, so
   a later layout can add fields without this one breaking.

   One optional field, `o`, is the skills the game was offering the racer and had not yet sold
   it, each as [id, hint level, level being bought]. A racer is complete without it.

   Needs CARDS and SKILLS. */
const RACER_TAG = 'UMA2';
const RACER_TAGS = ['UMA1', 'UMA2'];
const CAN_DEFLATE = typeof CompressionStream === 'function'
  && typeof DecompressionStream === 'function';

const squeeze = async (bytes, how) => new Uint8Array(await new Response(
  new Blob([bytes]).stream().pipeThrough(new how('deflate-raw'))).arrayBuffer());
const RACER_APT = ['ground_turf', 'ground_dirt', 'distance_short', 'distance_mile',
                   'distance_middle', 'distance_long', 'running_style_nige',
                   'running_style_senko', 'running_style_sashi', 'running_style_oikomi'];

const b64url = bytes => {
  let binary = '';
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g, '.').replace(/\//g, '_').replace(/=+$/, '');
};

const unb64url = text => {
  const plain = text.replace(/\./g, '+').replace(/_/g, '/');
  const binary = atob(plain + '='.repeat((4 - plain.length % 4) % 4));
  return Uint8Array.from(binary, c => c.charCodeAt(0));
};

const wordOf = (text, cap) => String(text || '').replace(/[^A-Za-z0-9]+/g, '').slice(0, cap);

function racerLabel(member){
  const named = CARDS[member.card] || ['', ''];
  const bits = [wordOf(named[0], 16), wordOf(named[1] || member.na, 16)].filter(Boolean);
  return bits.length ? bits.join('-') + '-' : '';
}

async function racerCode(member){
  const payload = {
    v: 1,
    c: member.card,
    r: member.rarity || 5,
    t: member.talent || 1,
    f: member.fans || 0,
    y: member.style || 1,
    s: [member.speed, member.stamina, member.power, member.guts, member.wiz]
      .map(n => Math.max(0, Math.round(Number(n) || 0))),
    a: RACER_APT.map(field => (member.apt || {})[field] || 0).join(''),
    k: (member.skills || []).map(([id, level]) => level > 1 ? [id, level] : id),
  };
  // Sent only when there is something on the offer screen.
  const offers = (member.offers || []).filter(row => row && row.id);
  if (offers.length)
    payload.o = offers.map(row => [row.id, row.hint || 0, row.level || 0]);
  const raw = new TextEncoder().encode(JSON.stringify(payload));
  let body = raw;
  let tag = 'UMA1';
  if (CAN_DEFLATE){
    try { body = await squeeze(raw, CompressionStream); tag = RACER_TAG; } catch {}
  }
  return racerLabel(member) + tag + '-' + b64url(body);
}

/* A code back into a runner, or a reason it is not one. Every field is checked: what arrives
   here was typed, pasted or carried in from somewhere else, and a racer half-read would race
   as something nobody built. */
async function readRacerCode(text){
  const tidy = String(text || '').trim().replace(/\s+/g, '');
  if (!tidy) return {error: 'Nothing pasted.'};
  if (!/^[A-Za-z0-9._-]+$/.test(tidy)) return {error: 'Not a racer code.'};
  const bits = tidy.split('-');
  const body = bits.pop();
  const tag = (bits.pop() || '').toUpperCase();
  if (!tag) return {error: 'Not a racer code — it carries no tag.'};
  if (!RACER_TAGS.includes(tag)) return {error: `${tag} is not a code this page reads.`};
  if (tag === 'UMA2' && !CAN_DEFLATE)
    return {error: 'This browser cannot unpack a UMA2 code.'};
  let raw;
  try {
    let bytes = unb64url(body);
    if (tag === 'UMA2') bytes = await squeeze(bytes, DecompressionStream);
    raw = JSON.parse(new TextDecoder().decode(bytes));
  } catch { return {error: 'The code is damaged — it did not decode.'}; }
  if (!raw || typeof raw !== 'object' || Array.isArray(raw))
    return {error: 'The code is damaged — it holds no racer.'};
  if (raw.v !== 1) return {error: `Racer code version ${raw.v}, which this page does not read.`};

  const card = Number(raw.c) || 0;
  if (!card) return {error: 'The code names no character.'};
  const stats = Array.isArray(raw.s) ? raw.s.map(n => Math.max(0, Math.round(Number(n) || 0))) : [];
  if (stats.length !== 5) return {error: 'The code does not carry five stats.'};
  const grades = String(raw.a || '');
  if (!/^[0-8]{10}$/.test(grades)) return {error: 'The code does not carry ten aptitudes.'};
  if (!Array.isArray(raw.k)) return {error: 'The code carries no skill list.'};

  const apt = {};
  RACER_APT.forEach((field, i) => { apt[field] = Number(grades[i]); });
  const skills = raw.k
    .map(entry => Array.isArray(entry) ? [Number(entry[0]) || 0, Number(entry[1]) || 1]
                                       : [Number(entry) || 0, 1])
    .filter(([id]) => id);
  // The offer screen, when the code carries one.
  const offers = Array.isArray(raw.o)
    ? raw.o.map(entry => Array.isArray(entry)
        ? {id: Number(entry[0]) || 0, hint: Math.max(0, Number(entry[1]) || 0),
           level: Math.max(0, Number(entry[2]) || 0)}
        : {id: Number(entry) || 0, hint: 0, level: 0})
      .filter(row => row.id)
    : null;
  const named = CARDS[card] || ['', 'Chara ' + card];
  return {racer: {
    card, ti: named[0], na: named[1], id: 0,
    rarity: Number(raw.r) || 5, talent: Number(raw.t) || 1, fans: Number(raw.f) || 0,
    speed: stats[0], stamina: stats[1], power: stats[2], guts: stats[3], wiz: stats[4],
    style: Number(raw.y) || 1,
    skills, apt, sup: [], ct: '', rs: 0,
    sp: skills.reduce((total, [id]) => total + (SKILLS[id]?.[3] || 0), 0),
    offers,
  }};
}

const STYLE_APT = {1:'running_style_nige', 2:'running_style_senko',
                   3:'running_style_sashi', 4:'running_style_oikomi'};
const DISTANCE_BAND = distance => distance <= 1400 ? ['distance_short', 'Sprint']
  : distance <= 1800 ? ['distance_mile', 'Mile']
  : distance <= 2400 ? ['distance_middle', 'Med'] : ['distance_long', 'Long'];

// The surface and distance the loaded rooms ask about. Every eligible race in a set of captures
// shares a course, so the first usable one speaks for them all.
function askedAptitudes(member){
  const race = RACES.find(r => !r.why) || RACES[0];
  const course = race ? COURSES[race.courseId] : null;
  if (!course) return [];
  const [field, label] = DISTANCE_BAND(course[1]);
  const ground = course[2] === 2 ? 'ground_dirt' : 'ground_turf';
  return [
    [course[2] === 2 ? 'Dirt' : 'Turf', member.apt[ground], ground],
    [label, member.apt[field], field],
  ];
}

const styleApt = member => member.apt[STYLE_APT[member.style]] || 0;
const rarityClass = r => r === 2 ? 'g' : r >= 3 ? 'u' : '';
/* An inherited unique is filed as an ordinary skill — rarity 1, the same name as the unique it
   came from, at that unique's id plus 800000. Nothing but the id says what it is, so the id is
   what says it: everything from 900000 up is one, and none of them is anything else. It is
   only ordered as a unique; it keeps the colour its rarity gives it, which is what it is worth. */
const isInherited = id => id >= 900000;

const APT_GROUPS = [
  ['Turf', 'ground_turf'], ['Dirt', 'ground_dirt'],
  ['Sprint', 'distance_short'], ['Mile', 'distance_mile'],
  ['Med', 'distance_middle'], ['Long', 'distance_long'],
  ['Front', 'running_style_nige'], ['Pace', 'running_style_senko'],
  ['Late', 'running_style_sashi'], ['End', 'running_style_oikomi'],
];

// `edit` is set only in a team slot, where the list can be changed: it carries the slot's index
// and the skills the template trained with, so anything else is shown as put on.
/* A skill name too long for its chip is cut in the middle, not at the end: the end is what
   tells two of them apart — "End Closer Corners ○" and "End Closer Straightaways ○" differ
   nowhere else, and so do the ○ and the ◎ of a pair. The name goes out in two pieces, the front
   given whatever room is left and an ellipsis when it runs out, the back always drawn whole.
   The split takes nothing out, so a chip with room for the name reads as the name. */
const NAME_TAIL = 8;
function midName(name){
  const text = String(name);
  const at = text.length > NAME_TAIL + 4 ? text.length - NAME_TAIL : text.length;
  return `<span class="hd">${esc(text.slice(0, at))}</span>`
    + (at < text.length ? `<span class="tl">${esc(text.slice(at))}</span>` : '');
}

// `act`, given only under a Results row, says how often each skill fired there, or why that is
// not known (see skillRates). Every chip gets the figure or a dash, so the names all cut alike.
function skillList(member, query, edit, dim, act){
  /* The runner's own unique leads, then the uniques it inherited, then everything else by
     rarity as before. */
  const own = new Set(UNIQUE[member.card] || []);
  const tier = id => own.has(id) ? 0 : isInherited(id) || (SKILLS[id]?.[1] || 0) >= 3 ? 1 : 2;
  return member.skills.slice()
    .sort((a, b) => tier(a[0]) - tier(b[0])
      || (SKILLS[b[0]]?.[1] || 0) - (SKILLS[a[0]]?.[1] || 0)
      || (SKILLS[a[0]]?.[0] || '').localeCompare(SKILLS[b[0]]?.[0] || ''))
    .map(([id, level]) => {
      const [name, rarity, debuff] = SKILLS[id] || ['Skill ' + id, 1, 0];
      const hit = query && tokenMatch(norm(name), query, false);
      const put = edit && !edit.own.has(id);
      // Only under a comparison is a skill either of these: on its own a chip is neither what
      // the copies share nor what tells them apart.
      const same = dim ? dim.has(id + '.' + (level || 1)) : null;
      const fired = act ? act(id) : null;
      return `<span class="sk ${rarityClass(rarity)}${hit ? ' hit' : ''}${put ? ' new' : ''}${
          same === null ? '' : same ? ' same' : ' diff'}"
          title="${esc(name)}${put ? ' \u2014 given to this runner' : ''}${!fired ? ''
            : fired.why ? ' \u00b7 no activation rate: ' + esc(fired.why)
            : ` \u00b7 fired in ${fired.n} of ${fired.races} races`}">`
        + (debuff ? '<svg class="db" viewBox="0 0 6 8" aria-hidden="true">'
                    + '<path d="M0 0l6 4-6 4z"/></svg>' : '')
        + `<span class="nm">${midName(name)}</span>`
        + (level > 1 ? `<i>${level}</i>` : '')
        + (fired ? `<b class="ar">${fired.why ? '—' : pct(fired.n / fired.races) + '%'}</b>` : '')
        + (edit ? `<button class="rm" data-unskill="${edit.slot}:${id}"
            title="Take this skill off">&times;</button>` : '')
        + '</span>';
    }).join('');
}

// What the bar under a slot offers: skills the runner does not already have, whatever the query
// catches. What a skill costs in skill points is what the choice is usually made on, so it is on
// the chip rather than only in its title.
function skillHits(index, member){
  const query = norm(state.sq[index] || '');
  if (!query) return '';
  const has = new Set(member.skills.map(([id]) => id));
  const hits = SKILL_LIST.filter(sk => !has.has(sk.id) && tokenMatch(sk.hay, query, false));
  if (!hits.length) return '<div class="hits"><span class="none">no skill by that name</span></div>';
  return `<div class="hits">${hits.slice(0, 40).map(sk =>
    `<button class="sk ${rarityClass(sk.rarity)}" data-addskill="${index}:${sk.id}"
        title="${esc(sk.name)} \u00b7 ${sk.points} skill points">`
      + (sk.debuff ? '<svg class="db" viewBox="0 0 6 8" aria-hidden="true">'
                     + '<path d="M0 0l6 4-6 4z"/></svg>' : '')
      + `<span class="nm">${midName(sk.name)}</span><i>${sk.points}</i></button>`).join('')}</div>`;
}

const statGrid = member => [['spd', member.speed], ['sta', member.stamina], ['wit', member.wiz],
                            ['pow', member.power], ['gut', member.guts], ['sp', member.sp || 0]]
  .map(([cls, n]) => `<span class="${cls}">${n}</span>`).join('');

const statRow = member => [['spd', member.speed], ['sta', member.stamina], ['pow', member.power],
                           ['gut', member.guts], ['wit', member.wiz]]
  .map(([cls, n]) => `<span class="${cls}">${n}</span>`).join('')
  + `<span class="sp">${member.sp || 0}</span>`;

function vetDetail(vet){
  const apts = APT_GROUPS.map(([label, field]) =>
    `<span class="p${vet.apt[field] >= 8 ? ' hi s' : vet.apt[field] >= 7 ? ' hi' : ''}">${esc(label)}`
    + `<b>${GRADES[vet.apt[field]] || '–'}</b></span>`).join('');
  return `<div class="vdet">
    <div class="sx">${statRow(vet)}</div>
    <div class="apts">${apts}</div>
    <div class="skl">${skillList(vet, state.vq ? norm(state.vq) : '')}</div>
    ${supportRow(vet.sup)}
  </div>`;
}

function slotBlock(chosen, index){
  if (!chosen) return `<div class="slot empty${state.aim === index ? ' aim' : ''}"
    data-aim="${index}">Pick runner ${index + 1}</div>`;
  const member = slotMembers()[index];
  const moved = member.style !== chosen.style;
  const own = new Set((chosen.skills || []).map(([id]) => id));
  // The two grades the course asks about, each one a choice. A grade that differs from the
  // template's is drawn as an override, as a moved style is, and says on hover what it was.
  const apts = askedAptitudes(member).map(([label, grade, field]) => {
    const was = chosen.apt?.[field] || 0;
    const ov = grade !== was;
    return `<label class="p${ov ? ' ov' : grade >= 8 ? ' hi s' : grade >= 7 ? ' hi' : ''}"
        title="${ov ? esc(`Trained with ${label} ${GRADES[was] || '–'}`)
                    : `Try this runner with a different ${label} grade`}">${esc(label)}
      <select class="apt" data-apt="${index}" data-field="${field}">${[8, 7, 6, 5, 4, 3, 2, 1]
        .map(n => `<option value="${n}"${n === grade ? ' selected' : ''}>${GRADES[n]}</option>`)
        .join('')}</select></label>`;
  }).join('');
  return `<div class="slot${state.aim === index ? ' aim' : ''}" data-aim="${index}">
    <div class="top">${face(member.card, 'face')}
      <span class="who"><span class="na">${esc(member.na)}</span>
        <span class="ti">${esc(member.ti)}</span></span>
      <select class="sty${moved ? ' ov' : styleApt(member) >= 8 ? ' hi s' : styleApt(member) >= 7 ? ' hi' : ''}" data-style="${index}"
        title="${moved ? esc(`Trained as ${STYLE_NAME[chosen.style] || '?'}`)
                       : 'Try this runner in a different style'}">
        ${[1, 2, 3, 4].map(n => `<option value="${n}"${n === member.style ? ' selected' : ''}
          >${STYLE_NAME[n]} ${GRADES[chosen.apt[STYLE_APT[n]]] || '–'}</option>`).join('')}
      </select>
      <button class="x" data-drop="${index}" title="Remove">×</button></div>
    <div class="sx">${statRow(member)}</div>
    <div class="apts">${apts}
      <button class="code" data-code="${index}"
        title="Copy this runner as a racer code, to paste into any of these pages">Copy</button>
    </div>
    <div class="skl">${skillList(member, '', {slot: index, own})}</div>
    <div class="sqbar">
      <input type="search" data-sq="${index}" value="${esc(state.sq[index] || '')}"
        placeholder="add a skill" autocomplete="off">
      <button class="sm" data-reskill="${index}"${state.skills[index] ? '' : ' disabled'}
        title="Back to the skills the template trained with">Reset</button>
    </div>
    ${skillHits(index, member)}
    ${supportRow(member.sup)}
  </div>`;
}

const slotTeam = () => state.slots.every(Boolean) ? teamOf(slotMembers(), 'staged') : null;

/* Copying a team into the slots is a starting point, not a link: what comes out of the slots is
   a team in its own right, and nothing is kept between the two. The veteran behind a runner is
   used when there is one, so the picker shows it as taken and the runner can be reset to what it
   trained with; a runner read out of a capture stands on its own. */
function copyToSlots(team){
  state.slots = team.members.map(m => VETS.find(v => v.id === m.id && v.card === m.card) || m);
  state.styles = team.members.map((m, i) => m.style !== state.slots[i]?.style ? m.style : null);
  state.apts = team.members.map((m, i) => aptOverrides(m.apt, state.slots[i]?.apt));
  state.skills = team.members.map((m, i) => {
    const list = m.skills || [];
    return sameSkills(list, state.slots[i]?.skills || []) ? null : list;
  });
  state.sq = ['', '', ''];
  state.aim = null;
  remember();
  renderSquad();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* The slot is drawn again on every keystroke, which takes the search box with it, so the box the
   caret was in is handed it back. Only the skill search sets this, so no other redraw moves the
   focus. */
let REFOCUS = null;

function renderSquad(){
  $('squad').innerHTML = state.slots.map((vet, index) => slotBlock(vet, index)).join('');
  if (REFOCUS !== null){
    const box = $('squad').querySelector(`input[data-sq="${REFOCUS}"]`);
    if (box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    REFOCUS = null;
  }
  const team = slotTeam();
  const already = team && state.teams.some(t => t.key === team.key);
  const stage = $('stage');
  stage.disabled = !team || already;
  stage.textContent = already ? 'Already staged' : 'Stage team';
  // Which staged row the slots match is part of what the squad says, so it is redrawn here
  // rather than only when the list itself changes.
  renderStaged();
  $('vhint').innerHTML = VETS.length ? ''
    : 'Drop a veterans file — the flat array of trained characters — to build teams here.';
  const picker = $('picker');
  picker.hidden = !VETS.length;
  if (picker.hidden) return;
  const chosen = new Set(state.slots.filter(Boolean).map(v => v.id));
  const rows = state.vq ? search(VETS, hayOf, norm(state.vq)) : VETS.slice();
  // Whoever actually ran in a loaded race comes first: those are the runners the reference rooms
  // were built out of, so they are the ones worth reaching for.
  const raced = v => state.racedFirst && ranHere(v) ? 0 : 1;
  const order = state.vsort === 'name'
    ? (a, b) => a.na.localeCompare(b.na) || b.rs - a.rs
    : state.vsort === 'ct'
    ? (a, b) => (b.ct || '').localeCompare(a.ct || '') || b.rs - a.rs
    : (a, b) => (b[state.vsort] || 0) - (a[state.vsort] || 0);
  rows.sort((a, b) => raced(a) - raced(b) || order(a, b));
  const at = VETS_AT ? new Date(VETS_AT) : null;
  const two = n => String(n).padStart(2, '0');
  $('upload').classList.toggle('re', VETS.length > 0);
  $('vat').textContent = at
    ? `added ${at.getFullYear()}-${two(at.getMonth() + 1)}-${two(at.getDate())} `
      + `${two(at.getHours())}:${two(at.getMinutes())}`
    : 'added –';
  const count = $('vn');
  count.classList.toggle('aim', state.aim !== null);
  count.textContent = state.aim !== null ? `for runner ${state.aim + 1}`
    : state.stale ? 're-add for dates'
    : `${rows.length} of ${VETS.length}`;
  count.title = state.aim !== null ? `Click a veteran to put it in runner ${state.aim + 1}`
    : state.stale ? 'Drop veterans.json again: the rows kept here have no training dates'
    : 'Veterans matching the search, of all in the file';
  $('vets').innerHTML = rows.slice(0, 200).map(vet =>
    `<div class="vrow"><div class="vet vgrid${chosen.has(vet.id) ? ' on' : ''}" data-vet="${vet.id}">
      ${face(vet.card, 'small')}
      <span class="ti">${esc(vet.ti)}</span>
      <span class="na">${esc(vet.na)}</span>
      <span class="rs">${vet.rs}</span>
      <span class="num spd">${vet.speed}</span><span class="num sta">${vet.stamina}</span>
      <span class="num pow">${vet.power}</span><span class="num gut">${vet.guts}</span>
      <span class="num wit">${vet.wiz}</span><span class="num sp">${vet.sp}</span>
      <span class="sty">${esc(STYLE_NAME[vet.style] || '?')}</span>
      <span class="rc${ranHere(vet) ? '' : ' ghost'}"
        title="Ran in ${racedCount(vet)} of the loaded races">raced ${racedCount(vet)}&times;</span>
      <span class="ct">${esc(vet.ct)}</span>
    </div>
    <button class="more" data-more="${vet.id}" title="Skills, aptitudes and cards"
      >${state.more === vet.id ? '&#9652;' : '&#9662;'}</button>
    </div>` + (state.more === vet.id ? vetDetail(vet) : '')).join('');
}

/* A team, shown as one thing: its three runners as a face, the style each runs and what each is
   worth, and whatever the row needs beside them. Its totals were five stat sums nobody compared
   across teams here; the runners are what tell two staged teams apart. */
function teamRow(team, opts){
  const o = opts || {};
  return `<div class="tm${o.on ? ' on' : ''}${o.hidden ? ' off' : ''}${o.match ? ' match' : ''}"
      data-team="${team.key}">
    ${o.pick ? `<input type="checkbox" class="box" data-pick="${team.key}"
      ${o.on ? ' checked' : ''}>` : ''}
    <span class="mem"${o.unfold ? ` data-unfold="${esc(o.unfold)}"` : ''}>
      ${team.members.map((m, slot) => `<span class="one"
          title="${esc((m.ti + ' ' + m.na).trim())}">${face(m.card, 'small')}
        <span class="sty">${esc(STYLE_NAME[m.style] || '?')}</span>
        <span class="rs" title="Rank score">${m.rs || '–'}</span>
        ${o.sim ? runnerMark(o.sim, slot) : ''}</span>`).join('')}
    </span>
    ${o.sim ? simMark(o.sim) : ''}
    <span class="acts">${o.acts || ''}</span>
    ${o.tail || ''}
  </div>`;
}

/* How far a team is through the distribution and what it has scored so far, as the rail says it
   but on one line: the count over the rooms in the distribution, then the win rate. A rate over
   part of the distribution is not the figure the whole one will give, so it is marked. */
function simMark(m){
  const some = m.cached > 0 && m.total > 0;
  return `<span class="sim${m.done ? ' ok' : some ? ' part' : ''}"
      title="${m.total === 0 ? 'No rooms in the distribution'
        : m.done ? `Run over every one of the ${m.total} rooms in the distribution`
        : `Run over ${m.cached} of the ${m.total} rooms in the distribution`}${
      some && !m.done ? ' · the rate is over those rooms alone' : ''}">
    <span>${m.cached}/${m.total}</span>
    <b>${m.rate === null || m.rate === undefined ? '&ndash;' : pct1(m.rate) + '%'}</b>
  </span>`;
}

/* This runner's share of the team's wins, over the same rooms the team figure is over — so it
   is marked as provisional on the same terms, and reads as a dash where the results it would be
   summed from never carried their runners. */
function runnerMark(m, slot){
  const rate = (m.runners || [])[slot];
  const part = rate !== null && rate !== undefined && !m.done;
  return `<span class="wr${part ? ' part' : ''}"
      title="${rate === null || rate === undefined
        ? 'These results carry no per-runner figures'
        : m.done ? 'Its wins over the distribution'
        : `Its wins over the ${m.cached} room${m.cached === 1 ? '' : 's'} of ${m.total} the team `
          + 'has been run in'}"
    >${rate === null || rate === undefined ? '&ndash;' : pct1(rate) + '%'}</span>`;
}

/* The three runners of a staged team side by side, everything each of them is. The same
   unfolding the Results tab does, so a team is read the same way wherever it is met. */
function stagedExpand(team){
  return `<div class="tmexp exp"><div class="three">
    ${team.members.map(member => `<div class="col">
      <div class="run" title="${esc((member.ti + ' ' + member.na).trim())}">
        ${face(member.card, 'small')}
        <span class="who"><span class="na">${esc(member.na)}</span>
          ${cardMarks(ssrOf(member), bkOf(member))}
          <span class="sty">${esc(STYLE_NAME[member.style] || '?')}</span></span>
      </div>
      ${memberDetail(member, {score: true})}
    </div>`).join('')}
  </div></div>`;
}

/* Hiding is the reversible way out: hidden, a team stays in this list and leaves the other tabs,
   and showing it again brings back everything it had. Deleting is not reversible and is asked
   for twice, so it is the last thing on the row rather than one of its actions. The batches run
   for a deleted team are left in the cache, filed under what the team was. */
function renderStaged(){
  const mark = teamMarks();
  // The team in the slots, when it is one of these: that row is why Stage team reads Already
  // staged, so it is marked rather than left for the eye to find.
  const inSlots = slotTeam()?.key || '';
  // Newest first, which is the one just staged. Only the drawing is reversed: the list itself
  // stays in the order the teams were staged in, and everything filed by team is unmoved.
  $('staged').innerHTML = state.teams.length
    ? [...state.teams].reverse().map(team => {
        const armed = state.stagedArmed === team.key;
        return teamRow(team, {hidden: state.hidden.has(team.key), sim: mark(team),
          match: team.key === inSlots, unfold: team.key,
          acts:
          `<button class="sm" data-copy="${esc(team.key)}"`
          + ` title="Load these three into the slots above">Copy</button>`
          + `<label class="ctl chk hide" title="Keep this team out of the Rooms, Simulate and`
          + ` Results tabs"><input type="checkbox" data-hide="${esc(team.key)}"`
          + `${state.hidden.has(team.key) ? ' checked' : ''}><span>Hide</span></label>`,
          tail: `<button class="unstage${armed ? ' arm' : ''}" data-unstage="${esc(team.key)}"
            ${armed && !state.stagedReady ? ' disabled' : ''}
            title="${armed ? 'Press again to take this team out of the list'
              : 'Take this team out of the list. Its results stay in the cache.'}"
            ><span class="dl">Delete</span><span class="cf">Confirm</span></button>`})
          + (state.stagedOpen.has(team.key) ? stagedExpand(team) : '');
      }).join('')
    : '<div class="none">Nothing staged yet. Fill the three slots and press Stage team.</div>';
}

/* Teams that raced in the uploads, offered as starting points. The same filter the Simulate tab
   uses, because the same reasoning applies: most teams in a set of uploads are one room's
   opponents and nothing else. A team already staged is not here — it is in the list above.
   Read off the raced teams rather than off the subjects, so a team held out of the other tabs
   is still on this one, with the box that holds it out ready to be ticked back. */
const uploadedTeams = () => {
  const staged = new Set(state.teams.map(t => t.key));
  return racedTeams().filter(team => !staged.has(team.key));
};
const copyable = () => uploadedTeams().filter(team =>
  state.picked.has(team.key) || (team.n || 0) >= state.minRaces);

function renderCopy(){
  const rows = copyable();
  const raced = uploadedTeams().length;
  $('minraces-t').value = String(state.minRaces);
  $('copysum').textContent = ROOMS.length
    ? `${rows.length} of ${raced} team${raced === 1 ? '' : 's'}`
    : 'No race captures loaded.';
  const mark = teamMarks();
  const shared = sharedSkills();
  $('copylist').innerHTML = rows.length
    ? rows.map(team => teamTile(team, {copy: true, shared, ...mark(team)})).join('')
    : `<div class="none">${ROOMS.length
        ? 'No team raced that often. Lower the filter to see more.'
        : 'Drop race captures to see the teams that raced in them.'}</div>`;
}

/* ---- the reference distribution ------------------------------------------------------------- */

// Everything a runner is, under the row it is on: the five stats and skill points, every
// aptitude, the skills it learned and the cards it was raised on.
function memberDetail(member, opts){
  const apts = APT_GROUPS.map(([label, field]) =>
    `<span class="p${member.apt[field] >= 8 ? ' hi s' : member.apt[field] >= 7 ? ' hi' : ''}">${esc(label)}`
    + `<b>${GRADES[member.apt[field]] || '–'}</b></span>`).join('');
  return `<div class="det">
    <div class="sx">${statRow(member)}${opts?.score
      ? `<span class="rs" title="Rank score">${member.rs || '–'}</span>` : ''}</div>
    <div class="apts">${apts}</div>
    <div class="skl">${skillList(member, '', null, null, opts?.act)}</div>
    ${supportRow(member.sup)}
  </div>`;
}

// How many of a runner's six support cards came out of the gacha, and how many copies that is,
// written beside its name. A team's own pair is the best any of its three carries.
const cardMarks = (ssr, bk) =>
  `<span class="ssr" title="${ssr} of six support cards are SSRs from the gacha">${ssr || ''}</span>`
  + `<span class="bk" title="Gacha SSR copies: one per card plus one per limit break, ${bk} of 30"`
  + `>${bk || ''}</span>`;

// The shading says which team was taken out; the words did not add anything. What the row does
// carry, once the room has been run back as it was raced, is what each team scored in it.
/* One runner's own wins in the as-raced batch, which the three of a team add up to. The batch
   names its runners by card and gate rather than by where they sit in a team, and a member's
   `gate` is the capture's 0-based frame order against the result's 1-based gate number. */
function runnerRate(base, teamId, member){
  const line = (base?.runners || []).filter(r => Number(r.teamId) === teamId);
  const found = line.find(r => Number(r.cardId) === member.card)
    || line.find(r => Number(r.gateNumber) === member.gate + 1)
    || line.find(r => Number(r.frameOrder) === member.gate);
  if (!found) return null;
  const races = base.races || RACE_COUNT;
  return found.winRate ?? (races ? found.wins / races : null);
}

function teamBlock(room, team, base){
  const out = team.teamId === room.outId;
  const won = base?.teams?.find(t => Number(t.teamId) === team.teamId);
  const top = base ? Math.max(...base.teams.map(t => t.winRate)) : -1;
  return `<div class="team${out ? ' out' : ''}">
    <div class="th"><span class="nm">${esc(team.trainer || 'Team ' + team.teamId)}</span>
      ${cardMarks(Math.max(...team.members.map(ssrOf), 0),
                  Math.max(...team.members.map(bkOf), 0))}
      <span class="wr${won && won.winRate >= top ? ' top' : ''}"
        >${won ? pct(won.winRate) + '%' : ''}</span></div>
    ${runnerLines(room, team, base)}
  </div>`;
}

/* The three runners of one team, stacked or side by side. Whichever way they are drawn they are
   the same rows with the same ids, so opening one, and which one is open, survives the switch. */
function runnerLines(room, team, base){
  const rows = team.members.map((m, slot) => {
    const id = `${room.key}:${team.teamId}:${slot}`;
    return {m, id, open: state.roomRunners.get(`${room.key}:${team.teamId}`) === id,
            rate: runnerRate(base, team.teamId, m)};
  });
  if (state.compact)
    return `<div class="runs">${rows.map(({m, id, open, rate}) =>
      `<span class="run mini${open ? ' open' : ''}" data-runner="${esc(id)}"
          title="${esc((m.ti + ' ' + m.na).trim())} \u00b7 ${esc(STYLE_NAME[m.style] || '?')}${
            rate === null ? '' : ' \u00b7 ' + pct(rate) + '% in the as-raced batch'}">
        ${face(m.card, 'small')}
        <span class="sty">${esc(STYLE_NAME[m.style] || '?')}</span>
        <span class="rwr">${rate === null ? '' : pct(rate) + '%'}</span>
      </span>`).join('')}</div>`
      + rows.filter(row => row.open).map(row => memberDetail(row.m)).join('');
  return rows.map(({m, id, open, rate}) =>
    `<div class="run${open ? ' open' : ''}" data-runner="${esc(id)}"
        title="${esc((m.ti + ' ' + m.na).trim())}">
      ${face(m.card, 'small')}
      <span class="who"><span class="na">${esc(m.na)}</span>
        ${cardMarks(ssrOf(m), bkOf(m))}
        <span class="sty">${esc(STYLE_NAME[m.style] || '?')}</span></span>
      <span class="ct">${esc(m.ct)}</span>
      <span class="rwr" title="This runner's wins in the as-raced batch"
        >${rate === null ? '' : pct(rate) + '%'}</span>
    </div>${open ? memberDetail(m) : ''}`).join('');
}

/* What the teams the simulate tab has picked score in this room, taken together: their wins over
   every race they ran here. Only once every one of them has a batch for the room — an average
   over whichever of them happen to be done is not a figure for the room. */
function roomAggregate(room, held){
  const rows = planRows();
  if (!rows.length || room.why) return null;
  let wins = 0, races = 0;
  for (const row of rows){
    const subject = subjectFor(row, room);
    const entry = subject && held.get(subject.key + '|' + room.key);
    if (!entry) return null;
    wins += winsOf(entry) ?? 0;
    races += entry.races || RACE_COUNT;
  }
  return races ? wins / races : null;
}

const roomOpen = room => [...state.roomRunners.keys()].some(key => key.startsWith(room.key + ':'));

function roomTile(room, base, agg){
  // A room held back by the sub-filter reads as out of the distribution, but its tick stays on:
  // the tick is what the page remembers, and the filter is only a view over it.
  const held = room.on && !room.why && !subKeeps(room);
  return `<div class="room${room.why ? ' bad' : room.on && !held ? '' : ' off'}"
      id="${room.raceKey}">
    <div class="hd">
      <input type="checkbox" class="box" data-room="${room.key}"${room.on ? ' checked' : ''}
        ${room.why ? ' disabled' : ''}>
      <span class="agg" title="Wins of every team picked on the simulate tab, over their races
        in this room"><u>Ease</u><b>${agg === null ? '&ndash;' : pct(agg) + '%'}</b></span>
      <span class="id">
        <span class="no">${room.tag || ''}</span>
        <span class="co">${esc(room.name)}</span>
        <span class="fn">${esc(courseLabel(room.race))} · seed ${room.race.seed ?? '—'}</span>
      </span>
      <span class="note${room.why ? ' bad' : ''}">${esc(room.why || '')}</span>
      <button class="fold" data-collapse="${room.key}" title="Close every runner open in this room"
        ${roomOpen(room) ? '' : ' disabled'}>Collapse</button>
    </div>
    ${room.why ? '' : `<div class="teams">${room.teams
      .slice().sort((a, b) => a.teamId - b.teamId)
      .map(t => teamBlock(room, t, base)).join('')}</div>`}
  </div>`;
}

function renderRooms(){
  const select = $('player');
  const names = playerNames();
  const signature = names.map(([name, n]) => name + ':' + n).join('|');
  if (select.dataset.names !== signature){
    select.dataset.names = signature;
    select.innerHTML = names.map(([name, n]) =>
      `<option value="${esc(name)}">${esc(name)} · ${n}</option>`).join('');
  }
  select.value = state.player;
  $('refwhy').innerHTML = RACES.length ? ''
    : 'Drop race captures anywhere on this page. The rooms are the races of the meeting chosen '
      + 'above; a race of neither meeting is listed as unusable.';
  const usable = ROOMS.filter(r => !r.why);
  $('nofront').className = state.noFront ? 'tog' : '';
  $('lastn').value = String(state.lastN);
  $('compact').className = state.compact ? 'tog' : '';
  $('refsum').innerHTML = RACES.length
    ? `${activeRooms().length} of ${usable.length} usable room`
      + `${usable.length === 1 ? '' : 's'}`
    : '';
  // A room that has been run back with the team that was taken out of it can show what
  // everyone in it scored.
  const base = new Map();
  const held = new Map();
  for (const entry of cacheHere()){
    held.set(entry.subject.key + '|' + entry.room.key, entry);
    if (entry.baseline) base.set(entry.room.key, entry);
  }
  $('rooms').innerHTML = ROOMS.map((room, i) =>
    (i && i % 5 === 0 ? '<div class="five"></div>' : '')
    + roomTile(room, base.get(room.key), roomAggregate(room, held))).join('');
  $('none').hidden = RACES.length > 0;
}

/* ---- the plan ---------------------------------------------------------------------------------- */

const cellText = cell => {
  if (!cell) return {cls: 'todo', text: '·'};
  if (cell.busy) return {cls: 'busy', text: cell.busy};
  if (cell.note) return {cls: 'err', text: '!'};
  if (cell.entry){
    const rate = rateOf(cell.entry);
    return {cls: cell.entry.baseline ? 'self' : '', text: rate === null ? '?' : pct(rate) + '%'};
  }
  return {cls: 'todo', text: '·'};
};

/* A racer, laid out: portrait, how many of its six support cards
   came out of the gacha and how many copies that is, its name and style, its five stats with
   skill points as a sixth, and the three aptitudes this course asks about. No win rate — here a
   runner is being chosen, not judged. Clicking one opens its skills and the cards it was raised
   on. */
/* Two runners of the same card opened side by side are being compared, and what they agree on
   is not what the comparison is about: a skill every opened copy of that card holds, at the same
   level, is faded in all of them so what differs stands out. Keyed by card, so runners of
   different characters are never set against each other, and drawn only where a card has more
   than one copy open — a single runner has nothing to be identical to. */
const skillKeys = member =>
  new Set((member.skills || []).map(([id, level]) => id + '.' + (level || 1)));

function sharedSkills(){
  const open = new Map();                      // one member per opened racer, by its own id
  for (const team of [...subjectsAll(), ...uploadedTeams()])
    team.members.forEach((member, slot) => {
      const id = team.key + ':' + slot;
      if (state.runners.has(id)) open.set(id, member);
    });
  const byCard = new Map();
  for (const member of open.values()){
    const list = byCard.get(member.card) || [];
    list.push(skillKeys(member));
    byCard.set(member.card, list);
  }
  const out = new Map();
  for (const [card, sets] of byCard){
    if (sets.length < 2) continue;
    const [first, ...rest] = sets;
    out.set(card, new Set([...first].filter(key => rest.every(other => other.has(key)))));
  }
  return out;
}

function racerAptitudes(member){
  const race = RACES.find(r => !r.why) || RACES[0];
  const course = race ? COURSES[race.courseId] : null;
  const dirt = course && course[2] === 2;
  const [field, label] = DISTANCE_BAND(course ? course[1] : 2000);
  return [
    [dirt ? 'Dirt' : 'Turf', member.apt[dirt ? 'ground_dirt' : 'ground_turf']],
    [label, member.apt[field]],
    [STYLE_NAME[member.style] || '?', member.apt[STYLE_APT[member.style]] || 0],
  ];
}

function racerRow(team, member, slot, marks, shared){
  const id = team.key + ':' + slot;
  const open = state.runners.has(id);
  // The last pip is the style the runner is in, which is the style column: the word carries the
  // weight there, so the row does not need a chip for it beside the name as well.
  const apts = racerAptitudes(member).map(([label, grade], i) =>
    `<span class="p${i === 2 ? ' st' : ''}${grade >= 8 ? ' hi s' : grade >= 7 ? ' hi' : ''}"><span>${esc(label)}</span>`
    + `<b>${GRADES[grade] || '–'}</b></span>`).join('');
  return `<div class="racer${open ? ' open' : ''}" data-runner="${esc(id)}"
      title="${esc((member.ti + ' ' + member.na).trim())}">
    <span class="por">${face(member.card, 'small')}${fakeRacer(member)
      ? '<span class="fk" title="Fake">F</span>' : ''}</span>
    <span class="cards">
      <span class="rs" title="Rank score">${member.rs || ''}</span>
      ${marks ? runnerMark(marks, slot) : '<span class="wr"></span>'}</span>
    <span class="sx">${statGrid(member)}</span>
    <span class="apts">${apts}</span>
  </div>${open ? `<div class="det">
    <div class="skl">${skillList(member, '', null, shared && shared.get(member.card))}</div>
    ${supportRow(member.sup)}
  </div>` : ''}`;
}

/* The rail down the left of a tile: whether the team is picked, how many of the uploaded races
   it appeared in, how much of the distribution it has already been run against, what it scored,
   and whether it was staged. No labels — the words are on hover. */
function teamTile(team, opts){
  const o = opts || {};
  return `<div class="tile${o.on ? ' on' : ''}${o.staged ? ' staged' : ''}${o.note ? ' noted' : ''}"
      data-team="${team.key}" title="${esc(team.label)}">
    ${o.note ? `<input type="text" class="note" data-note="${team.key}"
      value="${esc(NOTES[team.key] || '')}" spellcheck="false" autocomplete="off">` : ''}
    <div class="rail" ${o.copy
      ? `data-copyrow="${esc(team.key)}" title="Copy this team into the slots"`
      : `data-pickrow="${team.key}"`}>
      ${o.copy
        ? `<button class="add" data-copy="${esc(team.key)}"
            title="Copy this team into the slots">+</button>`
        : `<input type="checkbox" class="box" data-pick="${team.key}"${
            (o.tick ?? o.on) ? ' checked' : ''}>`}
      <span class="n" title="${o.staged ? 'Staged team, seen in ' : 'Seen in '}${team.n || 0} `
        + `of the uploaded races">${team.n || 0}&times;</span>
      <span class="frac${o.done ? ' ok' : ''}" title="Rooms this team already has a batch for"
        >${o.cached}/${o.total}</span>
      <span class="rate${o.rate !== null && o.rate !== undefined && !o.done ? ' part' : ''}"
        title="${o.done ? 'Wins over every race this team has run in the distribution'
          : `So far: wins over the ${o.cached} room${o.cached === 1 ? '' : 's'} of ${o.total} `
            + 'this team has been run in'}"
        >${o.rate === null || o.rate === undefined ? '&ndash;' : pct1(o.rate) + '%'}</span>
      <span class="src" title="${o.staged ? 'Staged in the Teams tab'
        : 'Seen in an upload, not staged'}">${o.staged ? 'FAKE' : 'REAL'}</span>
      ${o.copy ? `<input type="checkbox" class="box" data-show="${esc(team.key)}"
        ${state.hidden.has(team.key) ? '' : 'checked'}
        title="Whether the Rooms, Simulate and Results tabs are about this team. Unticked, it is
held out of them and stays here.">` : ''}
    </div>
    <div class="body">${team.members
      .map((m, slot) => racerRow(team, m, slot, o.runners ? o : null, o.shared)).join('')}</div>
  </div>`;
}

/* What the rail says about a team: how much of the distribution it has been run over and what
   it scored. Read off the cache rather than off the plan, so a team that has never been picked
   still says how much of the distribution it already has. A team part of the way through gets
   its figure too, over the rooms it has — a different question from the whole distribution,
   which is why the rail marks it as provisional rather than leaving it blank. */
function teamMarks(){
  const rooms = activeRooms();
  const held = new Map(cacheHere().map(e => [e.subject.key + '|' + e.room.key, e]));
  const covered = team => rooms.filter(room => held.has(team.key + '|' + room.key)).length;
  const aggregate = team => {
    const entries = rooms.map(room => held.get(team.key + '|' + room.key)).filter(Boolean);
    if (!entries.length) return null;
    const wins = entries.reduce((n, e) => n + (winsOf(e) ?? 0), 0);
    const races = entries.reduce((n, e) => n + (e.races || RACE_COUNT), 0);
    return races ? wins / races : null;
  };
  /* Each slot's own share of those wins, over the same races the team figure is over. A
     result written before exports carried their runners has team figures and no per-runner
     ones; a sum over nothing is 0, which would read as a racer that won nothing rather than
     one nobody counted, so every entry has to carry the line or the slot is unknown. */
  const perRunner = team => {
    const entries = rooms.map(room => held.get(team.key + '|' + room.key)).filter(Boolean);
    const races = entries.reduce((n, e) => n + (e.races || RACE_COUNT), 0);
    if (!entries.length || !races) return [null, null, null];
    const paired = entries.map(linesFor);
    return [0, 1, 2].map(slot => {
      const lines = paired.map(p => p[slot]);
      return lines.every(Boolean)
        ? lines.reduce((n, r) => n + (r.wins ?? 0), 0) / races : null;
    });
  };
  return team => ({cached: covered(team), total: rooms.length, rate: aggregate(team),
                   runners: perRunner(team),
                   done: rooms.length > 0 && covered(team) === rooms.length});
}

function renderPlan(){
  const rooms = activeRooms();
  const rows = planRows();
  const node = $('plan');
  if (!rooms.length || !rows.length){
    node.innerHTML = '<p class="hint">Pick teams above, and rooms on the Rooms tab.</p>';
    return;
  }
  // Each column is called what its room is called on the Rooms tab.
  const head = rooms.map(room => `<th title="${esc(room.name)}">${room.tag}</th>`).join('');
  const body = rows.map(row => {
    const cells = rooms.map(room => {
      const subject = subjectFor(row, room);
      return cellText(subject ? cellGet(subject, room) : null);
    });
    const rates = rooms.map(room => {
      const subject = subjectFor(row, room);
      const cell = subject && cellGet(subject, room);
      return cell && cell.entry ? rateOf(cell.entry) : null;
    }).filter(v => v !== null);
    const mean = rates.length ? rates.reduce((a, b) => a + b, 0) / rates.length : null;
    return `<tr data-row="${esc(row.key)}">
      <td title="${esc(row.label)}">${row.kind === 'team'
        ? `<span class="pf">${row.team.members.map(m => face(m.card, 'pt')).join('')}</span>`
        : esc(row.label)}</td>
      <td class="mute">${rates.length}/${rooms.length}</td>
      <td class="b">${mean === null ? '—' : pct1(mean) + '%'}</td>
      ${cells.map(c => `<td class="cell ${c.cls}">${esc(c.text)}</td>`).join('')}
    </tr>`;
  }).join('');
  /* Each room's average over the teams run in it, above everything else. The As raced row is
     left out of it, so the room's own team is not counted twice. Its mean is the mean of those
     room averages, as a team's mean is of its rooms. */
  const teamRows = rows.filter(row => row.kind === 'team');
  const avgs = rooms.map(room => {
    const rates = teamRows.map(row => {
      const cell = cellGet(row.team, room);
      return cell && cell.entry ? rateOf(cell.entry) : null;
    }).filter(v => v !== null);
    return rates.length ? rates.reduce((a, b) => a + b, 0) / rates.length : null;
  });
  const had = avgs.filter(v => v !== null);
  const avgRow = teamRows.length ? `<tr>
      <td title="Each room's average over the teams run in it, As raced left out">Room avg</td>
      <td class="mute">${had.length}/${rooms.length}</td>
      <td class="b">${had.length ? pct1(had.reduce((a, b) => a + b, 0) / had.length) + '%' : '—'}</td>
      ${avgs.map(v => v === null ? '<td class="cell todo">·</td>'
        : `<td class="cell">${pct(v)}%</td>`).join('')}
    </tr>` : '';
  const notes = planCells().filter(cell => cell.note);
  node.innerHTML = `<table>
    <thead><tr><th>Team</th><th class="mute">Rooms</th><th>Mean</th>${head}</tr></thead>
    <tbody>${avgRow}${body}</tbody>
  </table>
  <div class="legend cols">${rooms.map(room =>
    `<span title="${esc(room.name)}"><b>${room.tag}</b><i>${esc(room.name)}</i></span>`)
    .join('')}</div>
  ${notes.length ? `<div class="legend">${notes.map(cell =>
    `<span title="${esc(cell.room.name)}"><b>${cell.room.tag}</b>${esc(cell.note)}</span>`)
    .join('')}</div>` : ''}`;
}

/* ---- results ------------------------------------------------------------------------------------

Only teams that have been run over the whole of the current reference distribution: a mean taken
over a different set of rooms for each team would not be a comparison. "As raced" is a team in
this table like any other, except that it has no fixed members — in each room it is the team that
was taken out of that room — so it answers the question the others are measured against.

A team's win rate is its wins over every race it ran, and a runner's is its own share of those
wins. The three runners add up to the team. */

// A saved-at moment, to the minute: seconds say nothing about which race came first.
function minuteOf(ms){
  if (!ms) return '';
  const d = new Date(ms);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} `
    + `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// The same moment without the year: every capture is from the same one, so it only takes room.
const shortOf = ms => minuteOf(ms).slice(5);

// The same moment to the second, which is what tells two rooms saved in the same minute apart.
const secondOf = ms => ms
  ? minuteOf(ms) + ':' + String(new Date(ms).getSeconds()).padStart(2, '0') : '';

const lineOf = entry => (entry.runners || [])
  .filter(r => Number(r.teamId) === entry.subjectTeamId)
  .sort((a, b) => (a.gateNumber ?? 0) - (b.gateNumber ?? 0));

/* Which line belongs to which member, one per member in the team's own order. The batch names
   its runners by card and gate; a team's order is the canonical one it is identified by, and
   that is the gate order at most when the team was grafted into the room and no debuffer was
   moved to a debuffer's gate. The gate a line names is the one its slot starts from, before any
   draw of new gates for each race. A room run back as it was raced keeps the capture's own gates,
   so the two orders part company, and taking the lines by position hands a runner another
   runner's wins. A line that cannot be named by its card falls back to its place. */
function linesFor(entry){
  const line = lineOf(entry);
  const cards = (entry.subject?.members || []).map(m => Array.isArray(m) ? m[0] : m.card);
  const used = new Set();
  return cards.map((card, slot) => {
    let at = line.findIndex((r, i) => !used.has(i) && Number(r.cardId) === card);
    if (at < 0 && !used.has(slot) && slot < line.length) at = slot;
    if (at < 0) return null;
    used.add(at);
    return line[at];
  });
}

function results(){
  const rooms = activeRooms();
  const held = new Map();
  const base = new Map();
  for (const entry of cacheHere()){
    held.set(entry.subject.key + '|' + entry.room.key, entry);
    if (entry.baseline) base.set(entry.room.key, entry);
  }
  const tally = (row) => {
    const races = row.entries.reduce((n, e) => n + (e.races || RACE_COUNT), 0);
    const wins = row.entries.reduce((n, e) => n + (winsOf(e) ?? 0), 0);
    return {...row, races, wins, rate: races ? wins / races : null,
            /* A slot's wins, or null where they were never recorded. Results imported from a
               file written before exports carried their runners have team figures and no
               per-runner ones, and a sum over nothing is 0, which would read as a racer that
               won none of its races rather than one nobody counted. Every entry in the row has
               to carry the line for the total to mean anything, so one that does not makes the
               slot unknown rather than partial. */
            runners: (paired => [0, 1, 2].map(slot => {
              const lines = paired.map(p => p[slot]);
              return lines.every(Boolean)
                ? lines.reduce((n, r) => n + (r.wins ?? 0), 0) : null;
            }))(row.entries.map(linesFor))};
  };
  // The captures a team is in, earliest and latest: when it was first met and whether it is
  // still being met. As raced is in every room, so it spans them all; a staged team that never
  // raced is in none.
  const seenIn = team => {
    const seen = rooms.filter(room => room.teams.some(t => t.key === team.key))
      .map(room => room.saved).filter(Boolean);
    return seen.length ? {first: Math.min(...seen), last: Math.max(...seen)}
                       : {first: 0, last: 0};
  };
  const rows = [];
  if (rooms.length){
    const baseline = rooms.map(room => base.get(room.key));
    if (baseline.every(Boolean))
      rows.push(tally({key: 'BASE', label: 'As raced', virtual: true, entries: baseline,
                       first: Math.min(...rooms.map(r => r.saved || Infinity)),
                       last: Math.max(...rooms.map(r => r.saved || 0))}));
    for (const team of subjectsAll()){
      const entries = rooms.map(room => held.get(team.key + '|' + room.key));
      if (entries.every(Boolean))
        rows.push(tally({key: team.key, label: team.label, team, entries, ...seenIn(team)}));
    }
  }
  // Everything else is a team the distribution has only been partly run for; it is counted, not
  // shown, because a mean over a subset is not comparable with one over the whole.
  const partial = rooms.length
    ? subjectsAll().filter(team => {
        const n = rooms.filter(room => held.has(team.key + '|' + room.key)).length;
        return n > 0 && n < rooms.length;
      }).length
    : 0;
  const virtual = rows.find(r => r.virtual) || null;
  const teams = rows.filter(r => !r.virtual).sort((a, b) => (b.rate ?? -1) - (a.rate ?? -1));
  return {rooms, rows: virtual ? [virtual, ...teams] : teams, partial, virtual};
}

      <td class="kind" ${open} title="${real ? 'Raced in one of the uploads'
        : 'Invented in the Teams tab; never raced'}"><span class="tag${real ? '' : ' acc'}">${

        delta === null ? '' : (delta > 0 ? '+' : '') + delta}</td>
      <td class="mute mid">${row.wins}/${row.races}</td>
      ${[0, 1, 2].map(slot => cell(row, slot)).join('')}
      <td class="mute" title="${esc(Number.isFinite(row.first) ? minuteOf(row.first) : '')}">${
        esc(Number.isFinite(row.first) ? shortOf(row.first) : '')}</td>

  }).join('');
  $('matrix').innerHTML = `<table>
    <thead><tr><th class="kind"></th><th class="nm">Team</th><th>WR%</th>
      <th class="mid">&Delta;</th><th class="mute mid">Wins</th><th></th><th></th><th></th>
      <th class="mute">First seen</th><th class="mute">Last seen</th></tr></thead>
    <tbody>${body}</tbody>
  </table>`;
  renderDetail(rows.find(r => r.key === state.open && !r.virtual) || null, rooms);
}

/* An open team row unfolds straight onto its three runners side by side, each with what it took
   of the team's races and everything it is. Comparing the three is the point, so they are all
   there at once rather than behind a second click. */
function teamExpand(row){
  if (row.virtual || !row.team) return '';
  return `<tr class="exp"><td colspan="10">
    <div class="three">
      ${row.team.members.map((member, slot) => `<div class="col">
        <div class="run" title="${esc((member.ti + ' ' + member.na).trim())}">
          ${face(member.card, 'small')}
          <span class="who"><span class="na">${esc(member.na)}</span>
            ${cardMarks(ssrOf(member), bkOf(member))}
            <span class="sty">${esc(STYLE_NAME[member.style] || '?')}</span></span>
          <span class="ct" title="${row.runners[slot] === null
            ? 'These results carry no per-runner figures' : 'Its wins over the distribution'}"
            >${row.runners[slot] === null || !row.races ? '—'
              : pct1(row.runners[slot] / row.races) + '%'}</span>
        </div>
        ${memberDetail(member, {score: true, act: skillRates(row, slot)})}
      </div>`).join('')}
    </div></td></tr>`;
}

/* How often each of one runner's skills fired over a row's rooms, by skill id: the races it went
   off in at least once, out of every race the row ran, so a skill that fires twice in a race is
   still one race. As with the wins,
   every entry has to carry the count for the sum to mean anything. A skill without a figure is
   given the reason instead: it never went into the race, or some of the rooms' results lack the
   runner, its activations, or that one skill in them. */
function skillRates(row, slot){
  const member = row.team.members[slot];
  const rooms = row.entries.length;
  const of = n => `${n} of ${rooms} room${rooms === 1 ? '' : 's'}`;
  const lines = row.entries.map(entry => linesFor(entry)[slot]);
  const noLine = lines.filter(line => !line).length;
  const noAct = lines.filter(line => line && !Array.isArray(line.skillActivations)).length;
  const gap = [noLine ? `the results for ${of(noLine)} carry no per-runner figures` : '',
               noAct ? `the results for ${of(noAct)} carry no skill activations` : '']
    .filter(Boolean).join('; ');
  const races = row.entries.reduce((n, e) => n + (e.races || RACE_COUNT), 0);
  const seen = new Map();
  for (const line of lines) for (const s of line?.skillActivations || []){
    const id = Number(s.skillId), n = Number(s.racesActivated);
    if (!Number.isFinite(n)) continue;
    const at = seen.get(id) || {n: 0, in: 0};
    seen.set(id, {n: at.n + n, in: at.in + 1});
  }
  const raced = new Set(raceSkills(member).map(([id]) => id));
  return id => {
    if (!raced.has(id)){
      const over = member.skills.find(([up]) => NEEDS[up] === id);
      return {why: `not raced: ${over ? SKILLS[over[0]]?.[0] || 'Skill ' + over[0] : 'the skill above it'}`
                   + ' replaces it'};
    }
    if (gap) return {why: gap};
    const at = seen.get(id);
    if (!at || at.in < rooms)
      return {why: `missing from the activation counts for ${of(rooms - (at?.in || 0))}`};
    return {n: at.n, races};
  };
}

// One room at a time for the team picked in the table above, against what it was up against.
function renderDetail(row, rooms){
  if (!row){
    $('detail').innerHTML = '<p class="hint">Pick a team above to see it room by room.</p>';
    return;
  }
  /* What one runner took of the room's races, beside the face that took it. The team figure
     on the row is the three of them added up. As raced has runners here where the table above
     it has none: every room fielded a team of its own, and this is the room. */
  const cell = (entry, slot) => {
    const line = linesFor(entry)[slot];
    const card = row.team ? row.team.members[slot].card
                          : (entry.subject.members[slot] || [])[0];
    if (!line) return `<td class="who" title="These results carry no per-runner figures"
      ><span class="one">${face(card, 'small')}<b class="mute">&mdash;</b></span></td>`;
    const races = entry.races || RACE_COUNT;
    return `<td class="who"><span class="one">${face(card, 'small')}
      <b>${races ? pct1((line.wins ?? 0) / races) : '&mdash;'}<u>%</u></b></span></td>`;
  };
  const body = rooms.map((room, i) => {
    const entry = row.entries[i];
    const rate = rateOf(entry), wins = winsOf(entry);
    const others = (entry.teams || [])
      .filter(t => Number(t.teamId) !== entry.subjectTeamId)
      .map(t => {
        const opp = (entry.room.opp || []).find(o => Number(o.teamId) === Number(t.teamId));
        return `${esc(opp?.trainer || opp?.label || 'Team ' + t.teamId)} ${pct(t.winRate)}%`;
      }).join(' · ');
    return `<tr>
      <td title="${esc(room.name)}">${esc(room.name)}</td>
      <td class="mute" title="When the capture was saved">${
        esc(secondOf(room.saved || entry.room.saved))}</td>
      <td class="b">${rate === null ? '—' : pct(rate) + '%'}</td>
      <td class="mute">${wins === null ? '' : wins + '/' + (entry.races || RACE_COUNT)}</td>
      ${[0, 1, 2].map(slot => cell(entry, slot)).join('')}
      <td class="mute">${esc(others)}</td>
      <td class="mute" title="When the batch was simulated">${
        esc(entry.ts ? secondOf(entry.ts) : entry.at || '')}</td>
    </tr>`;
  }).join('');
  $('detail').innerHTML = `<table>
    <thead><tr><th>Filename</th>
      <th class="mute">Saved</th><th>Win rate</th>
      <th class="mute">Wins</th><th></th><th></th><th></th>
      <th class="mute">Opponents</th>
      <th class="mute">Sim run</th></tr></thead>
    <tbody>${body}</tbody></table>`;
}

/* ---- the bar and the tabs ------------------------------------------------------------------------ */

function renderBar(){
  const todo = todoCells().length;
  const run = $('run');
  const stale = state.running && !state.stop && queueStale();
  run.disabled = state.running ? !stale : !todo || (state.armed && !state.ready);
  run.className = state.armed ? 'arm' : 'go';
  run.textContent = stale ? 'Update queue' : state.running ? 'Running' : state.armed ? 'Confirm'
    : todo ? `Run ${todo} batch${todo === 1 ? '' : 'es'}`
    : ROOMS.length ? 'Nothing to run' : 'No rooms';
  $('stop').disabled = !state.running;
  // A run is a queue of the chosen meeting's batches, so the meeting holds still until it is done.
  $('cm').value = state.cm;
  $('cm').disabled = state.running;
  $('prog').textContent = state.note || (todo ? `${todo} batch${todo === 1 ? '' : 'es'} to run`
    : planRows().length ? 'all cached' : '');
  $('sub').textContent = `${RACES.length} race${RACES.length === 1 ? '' : 's'} · `
    + `${VETS.length} veterans`;
}

function renderTabs(){
  $('n-teams').textContent = state.teams.length || '';
  $('n-ref').textContent = activeRooms().length || '';
  $('n-sim').textContent = todoCells().length || '';
  $('n-out').textContent = cacheHere().length || '';
  document.body.classList.toggle('wide', state.tab === 'sim');
  for (const tab of document.querySelectorAll('.tab'))
    tab.classList.toggle('on', tab.dataset.tab === state.tab);
  for (const name of ['teams', 'ref', 'sim', 'out'])
    $('pane-' + name).hidden = state.tab !== name;
}

function render(){
  renderTabs();
  renderBar();
  renderSquad();                   // which draws the staged list, the slots being marked in it
  renderCopy();
  renderRooms();
  renderSubjects();
  renderPlan();
  renderLog();
  renderResults();
}

/* A racer that was never trained: no veterans file has it and no capture holds it, so the slot
   is filled with the runner the code carries rather than with a template it could be reset to.
   It goes where the next veteran would have gone — the slot being aimed at, or the first empty
   one — and from there it is a runner like any other. */
$('rload').onclick = async () => {
  const answer = await readRacerCode($('rcode').value);
  const err = $('err');
  if (answer.error){ err.textContent = answer.error; return; }
  const index = state.aim ?? state.slots.findIndex(v => !v);
  if (index < 0){
    err.textContent = 'All three slots are taken \u2014 clear one, or click the slot to fill.';
    return;
  }
  err.textContent = '';
  state.slots[index] = answer.racer;
  state.styles[index] = null; state.apts[index] = null;
  state.skills[index] = null;
  state.sq[index] = '';
  state.aim = null;
  $('rcode').value = '';
  remember();
  renderSquad();
};

/* Opened off disk, the clipboard is not always given out, so a refused write falls back to the
   old command over a box put up for the length of the copy. The button says which happened
   rather than claiming a copy that never landed. */
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const box = document.createElement('textarea');
  box.value = text;
  box.setAttribute('readonly', '');
  box.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.append(box);
  box.select();
  let done = false;
  try { done = document.execCommand('copy'); } catch {}
  box.remove();
  return done;
}

/* The two deletes on the Results tab, asked for twice with the same dead time and lapse as the
   run button, and any click elsewhere putting them back. */
let DROP_ARM = null;
function disarmDrop(){
  if (!DROP_ARM) return;
  clearTimeout(DROP_ARM.wait); clearTimeout(DROP_ARM.lapse);
  $(DROP_ARM.id).classList.remove('arm');
  DROP_ARM = null;
  renderDrops();
}
function armDrop(id, act){
  if (DROP_ARM?.id === id){
    if (!DROP_ARM.ready) return;
    disarmDrop();
    act();
    return;
  }
  disarmDrop();
  DROP_ARM = {id, ready: false,
              wait: setTimeout(() => { if (DROP_ARM) DROP_ARM.ready = true; renderDrops(); },
                               ARM_WAIT_MS),
              lapse: setTimeout(disarmDrop, ARM_MS)};
  $(id).classList.add('arm');
  renderDrops();
}
$('dropgone').onclick = () => armDrop('dropgone', () => dropResults(orphaned()));
$('dropold').onclick = () => armDrop('dropold',
  () => dropResults(cacheHere().slice(0, Number($('oldn').value) || 0)));
$('oldn').onchange = () => disarmDrop();

$('outdl').onclick = () => download(`room_sim_results_${stamp()}.json`,
  JSON.stringify(cacheHere().map(e => ({
    key: e.key, subject: e.subject, subjectTeamId: e.subjectTeamId,
    room: e.room, baseline: !!e.baseline, teams: e.teams, runners: e.runners || [],
    winRate: rateOf(e), wins: winsOf(e), races: e.races, seedStart: e.seedStart, seeds: e.seeds,
    engine: e.engine, at: e.at, ts: e.ts || 0,
  })), null, 1));

// The run is many batches at once, so it is asked for twice: the first click arms the button and
// only the second submits. Half a second of dead time stops a double click carrying through.
let UNSTAGE = null;
function disarmUnstage(repaint){
  if (UNSTAGE){ clearTimeout(UNSTAGE.wait); clearTimeout(UNSTAGE.lapse); UNSTAGE = null; }
  state.stagedArmed = '';
  state.stagedReady = false;
  if (repaint) renderStaged();
}

let ARM = null;
function disarm(repaint){
  if (!ARM) return;
  clearTimeout(ARM.timer); clearTimeout(ARM.wait);
  ARM = null; state.armed = false; state.ready = false;
  if (repaint) renderBar();
}

$('run').onclick = () => {
  if (state.running){ queueUpdate(); return; }
  if (state.armed){
    if (!state.ready) return;
    disarm(false);
    void runPlan();
    return;
  }
  state.armed = true; state.ready = false;
  ARM = {wait: setTimeout(() => { state.ready = true; renderBar(); }, ARM_WAIT_MS),
         timer: setTimeout(() => disarm(true), ARM_MS)};
  renderBar();
};

document.addEventListener('click', e => {
  if (ARM && !e.target.closest('#run')) disarm(true);
  if (DROP_ARM && !e.target.closest('#' + DROP_ARM.id)) disarmDrop();
  if (state.stagedArmed && !e.target.closest('button[data-unstage]')){
    // The repaint waits for the click to finish, so the handlers below still read live nodes.
    disarmUnstage(false);
    queueMicrotask(renderStaged);
  }
}, true);

// Choosing the style the runner actually trained in drops the override rather than recording it.
document.body.onchange = e => {
  const apt = e.target.closest('select[data-apt]');
  if (apt){
    const index = Number(apt.dataset.apt), field = apt.dataset.field;
    const template = state.slots[index]?.apt;
    state.apts[index] = aptOverrides({...template, ...state.apts[index],
                                      [field]: Number(apt.value)}, template);
    remember();
    renderSquad();
    return;
  }
  const style = e.target.closest('select[data-style]');
  if (style){
    const index = Number(style.dataset.style), picked = Number(style.value);
    state.styles[index] = picked === state.slots[index]?.style ? null : picked;
    remember();
    renderSquad();
    return;
  }
  const room = e.target.closest('input[data-room]');
  if (room){
    const found = ROOMS.find(r => r.key === room.dataset.room);
    if (!found) return;
    found.on = room.checked;
    if (found.on) state.off.delete(found.key); else state.off.add(found.key);
    afterRooms();
    return;
  }
  if (e.target.closest('#minraces')) return;
  // Hiding leaves the tick where it is: a team shown again is picked again if it was picked.
  const hide = e.target.closest('input[data-hide]');
  if (hide){
    if (hide.checked) state.hidden.add(hide.dataset.hide);
    else state.hidden.delete(hide.dataset.hide);
    remember(); render();
    void price();
    return;
  }
  /* The same holding-out the staged list calls Hide, asked the other way round: ticked is the
     team being one of the ones the other tabs are about. The tick it has on those tabs is left
     where it is, so a team brought back is picked again if it was picked. */
  const show = e.target.closest('input[data-show]');
  if (show){
    if (show.checked) state.hidden.delete(show.dataset.show);
    else state.hidden.add(show.dataset.show);
    remember(); render();
    void price();
    return;
  }
  const pick = e.target.closest('input[data-pick]');
  if (pick){
    if (pick.checked) state.picked.add(pick.dataset.pick);
    else state.picked.delete(pick.dataset.pick);
    remember();
    renderSubjects(); renderPlan(); renderBar(); renderTabs();
    void price();
    return;
  }
  if (e.target.closest('input[data-base]')){
    state.base = e.target.checked;
    remember();
    renderSubjects(); renderPlan(); renderBar(); renderTabs();
    void price();
  }
};

// A skill list that comes back to the template's own stops being an override, so a racer edited
// back to where it started is the template again rather than an invention that matches it.
function setSkills(index, list){
  const vet = state.slots[index];
  state.skills[index] = vet && sameSkills(list, vet.skills || []) ? null : list;
  remember(); renderSquad();
}

document.body.onclick = e => {
  const add = e.target.closest('[data-addskill]');
  if (add){
    const [index, id] = add.dataset.addskill.split(':').map(Number);
    const member = slotMembers()[index];
    if (!member) return;
    REFOCUS = index;                      // the bar stays as it is, for the next skill
    if (member.skills.some(([sk]) => sk === id)) renderSquad();
    else setSkills(index, [...member.skills, [id, 1]]);
    return;
  }
  const off = e.target.closest('[data-unskill]');
  if (off){
    const [index, id] = off.dataset.unskill.split(':').map(Number);
    const member = slotMembers()[index];
    if (!member) return;
    setSkills(index, member.skills.filter(([sk]) => sk !== id));
    return;
  }
  const reskill = e.target.closest('[data-reskill]');
  if (reskill){
    const index = Number(reskill.dataset.reskill);
    state.skills[index] = null; state.sq[index] = '';
    remember(); renderSquad();
    return;
  }
  /* A slot handed on as a line of text: what the runner is, not where it came from. The
     answer is a promise, so the button says what happened when it comes back. */
  const code = e.target.closest('button[data-code]');
  if (code){
    const member = slotMembers()[Number(code.dataset.code)];
    if (!member) return;
    racerCode(member).then(copyText).then(done => {
      code.textContent = done ? 'copied' : 'Ctrl+C';
    });
    return;
  }
  const drop = e.target.closest('button[data-drop]');
  if (drop){
    const index = Number(drop.dataset.drop);
    state.slots[index] = null; state.styles[index] = null; state.apts[index] = null;
    state.skills[index] = null; state.sq[index] = '';
    remember(); renderSquad();
    return;
  }
  /* Asked for twice, with the same dead time and the same lapse the run button has: half a
     second held shut so a double click cannot carry through, five seconds before the ask goes
     stale, and any click somewhere else putting it back to Delete. The team goes, and what was
     run for it stays in the cache under the key it had. */
  const unstage = e.target.closest('button[data-unstage]');
  if (unstage){
    const key = unstage.dataset.unstage;
    if (state.stagedArmed === key){
      if (!state.stagedReady) return;
      disarmUnstage(false);
      state.teams = state.teams.filter(t => t.key !== key);
      state.hidden.delete(key); state.picked.delete(key); state.stagedOpen.delete(key);
      remember(); render();
      void price();
      return;
    }
    // Arming one row drops whatever another row was holding.
    disarmUnstage(false);
    state.stagedArmed = key;
    const armed = {};
    armed.wait = setTimeout(() => { state.stagedReady = true; renderStaged(); }, ARM_WAIT_MS);
    armed.lapse = setTimeout(() => disarmUnstage(true), ARM_MS);
    UNSTAGE = armed;
    renderStaged();
    return;
  }
  const unfold = e.target.closest('[data-unfold]');
  if (unfold){
    const key = unfold.dataset.unfold;
    if (!state.stagedOpen.delete(key)) state.stagedOpen.add(key);
    renderStaged();
    return;
  }
  const copy = e.target.closest('button[data-copy]');
  if (copy){
    const team = copyableOf(copy.dataset.copy);
    if (!team) return;
    copyToSlots(team);
    return;
  }
  const open = e.target.closest('[data-open]');
  if (open){
    state.open = state.open === open.dataset.open ? '' : open.dataset.open;
    renderResults();
    return;
  }
  // The style and grade dropdowns sit inside the slot; opening one, or clicking a grade's name,
  // is not a click on the slot.
  if (e.target.closest('select') || e.target.closest('input') || e.target.closest('label.p')) return;
  const slot = e.target.closest('[data-aim]');
  if (slot){
    const index = Number(slot.dataset.aim);
    state.aim = state.aim === index ? null : index;
    renderSquad();
    return;
  }
  const more = e.target.closest('button[data-more]');
  if (more){
    const id = Number(more.dataset.more);
    state.more = state.more === id ? 0 : id;
    renderSquad();
    return;
  }
  const vet = e.target.closest('[data-vet]');
  if (vet){
    const chosen = VETS.find(v => v.id === Number(vet.dataset.vet));
    if (!chosen) return;
    const at = state.slots.findIndex(v => v && v.id === chosen.id);
    if (at >= 0){
      state.slots[at] = null; state.styles[at] = null; state.skills[at] = null; state.sq[at] = '';
      state.apts[at] = null;
    } else {
      const index = state.aim ?? state.slots.findIndex(v => !v);
      if (index < 0) return;
      state.slots[index] = chosen; state.styles[index] = null; state.apts[index] = null;
      state.skills[index] = null; state.sq[index] = '';
      state.aim = null;
    }
    remember(); renderSquad();
    return;
  }
  // A racer opens its skills and the cards it was raised on; the line above it picks the team.
  const racer = e.target.closest('#subjects .racer, #copylist .racer');
  if (racer){
    const id = racer.dataset.runner;
    // Several racers stay open together: the point of opening one is to set it beside another.
    if (!state.runners.delete(id)) state.runners.add(id);
    renderSubjects(); renderCopy();
    return;
  }
  // The rail of an uploaded team does what its mark does: the whole strip is the copy.
  const copyrow = e.target.closest('#copylist .rail[data-copyrow]');
  if (copyrow){
    const team = copyableOf(copyrow.dataset.copyrow);
    if (team) copyToSlots(team);
    return;
  }
  const row = e.target.closest('#subjects .rail, #baseline .th');
  if (row){
    if (row.hasAttribute('data-baserow')){
      state.base = !state.base;
    } else {
      const key = row.dataset.pickrow;
      if (!key) return;
      if (state.picked.has(key)) state.picked.delete(key); else state.picked.add(key);
    }
    remember();
    renderSubjects(); renderPlan(); renderBar(); renderTabs();
    void price();
    return;
  }
  // One runner open in each team, every team and room on its own: opening a runner closes only
  // the one its own team had open.
  const runner = e.target.closest('#rooms .run[data-runner]');
  if (runner){
    const id = runner.dataset.runner, team = id.slice(0, id.lastIndexOf(':'));
    if (state.roomRunners.get(team) === id) state.roomRunners.delete(team);
    else state.roomRunners.set(team, id);
    renderRooms();
    return;
  }
  const fold = e.target.closest('#rooms button[data-collapse]');
  if (fold){
    for (const key of [...state.roomRunners.keys()])
      if (key.startsWith(fold.dataset.collapse + ':')) state.roomRunners.delete(key);
    renderRooms();
  }
};

onStoreTrouble = note => { const err = $('err'); if (err) err.textContent = note; };

// A veterans file and the teams staged out of it are still here from an earlier visit; the races
// are not, and have to be dropped again. The results are deflated in localStorage and have to be
// read back and inflated, which is not synchronous, and the plan and the Results tab are both
// read out of them, so the page opens when they are there rather than drawing itself twice.
RESULT_READY.then(() => {
  logLoad();
  for (const r of RLOG)
    if (r.kind === 'submit' && Date.now() - r.t < GOVERNOR.ceiling) SENT.push(r.t);
  recall();
  rebuildRooms();
  render();
  void price();
});

addEventListener('pagehide', () => {
  if (ACTIVE) navigator.sendBeacon?.(ACTIVE.cancel,
    new Blob([JSON.stringify({accessToken: ACTIVE.accessToken})], {type: 'text/plain'}));
  ACTIVE = null;
});
</script>
</body>
</html>
