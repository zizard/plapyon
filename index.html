/* ---- what this page is ----------------------------------------------------------------------

Four tabs over one substrate. The substrate is the race captures dropped on the page and a
veterans file; everything else is built out of them.

  Teams      build a three-runner team and stage it. A slot takes a veteran as its template and
             invents a racer from it: the running style and the skill list can both be changed,
             which is what lets a team be one that never raced. The veterans file is only ever
             read, and an invented racer belongs to the team being built and to nothing else.
             Building and changing teams happens here and nowhere else; the other tabs take a
             team as given. A racer can also arrive as a code pasted into the box on this tab,
             which fills a slot with a runner no file holds.
  Rooms      the rooms to race against, the reference distribution. A room is an uploaded race
             with one team taken out of it — the team of the trainer who appears most often,
             which is whoever these captures belong to. What is left is two opponents and a
             vacant slot.
  Simulate   fill that slot. Either with the team that actually raced there — the reference
             distribution's own baseline — or with any team from tab 1 or any team seen in the
             uploads, run against every room.
  Results    the win rates, team by room.

Every simulation is one 100-race batch at the capture's own seed, so a team in a room is one
fixed question with one answer, and that answer is cached under the exact request that asked it.

The meetings below are the ones the page sets rooms up for, one at a time, chosen in the bar: the
rooms, the staged teams and the results shown are that meeting's. A meeting with `randomGates`
races with new gates in every race; the others keep the capture's gates. */

const API = 'https://hakuraku.moe';
const link = href => new URL(href, API).href;
const MEETINGS = [
  {id: 'cm19', label: 'CM19', courseId: 10808, season: 3, weather: 1, ground: 1},
  {id: 'cm20', label: 'CM20', courseId: 10506, season: 4, weather: 2, ground: 2},
  {id: 'cm21', label: 'CM21', courseId: 10701, season: 4, weather: 1, ground: 1, randomGates: true},
];
// A race, or the room a result was run in, on the meeting's course under its conditions.
const sameMeeting = (r, m) => r.courseId === m.courseId && r.season === m.season
  && r.weather === m.weather && r.ground === m.ground;
const meetingOf = r => MEETINGS.find(m => sameMeeting(r, m)) || null;
const meetingLabel = m => {
  const [place, distance, surface] = COURSES[m.courseId] || ['Course ' + m.courseId, 0, 1];
  return `${m.label} ${place} ${Number(distance).toLocaleString('en-US')}m `
    + (surface === 2 ? 'Dirt' : 'Turf');
};
const RACE_COUNT = 100;
const POLL_MS = 750;
const POLL_TOLERANCE = 3;
const ARM_MS = 5000;
const ARM_WAIT_MS = 500;

const GOVERNOR = {span: 65000, base: 65000, max: 4, ceiling: 150000, streak: 0, clean: 10};
const SENT = [];
const RETRIES = 4;
const RETRY_STATUS = new Set([408, 425, 429, 500, 502, 503, 504]);

/* ---- capture reading --------------------------------------------------------------------------

Either capture schema is read: the older C# backing-field export and the newer camelCase one.
Inside both, each horse's response data keeps its snake_case names. */

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isRecord = v => v !== null && typeof v === 'object' && !Array.isArray(v);

function val(record, keys){
  if (!isRecord(record)) return undefined;
  for (const key of keys) if (record[key] !== undefined && record[key] !== null) return record[key];
  return undefined;
}

const SEASON  = {spring:1, cherryblossom:1, summer:2, fall:3, autumn:3, winter:4};
const WEATHER = {sunny:1, cloudy:2, rainy:3, rain:3, snow:4, snowy:4};
const GROUND_LEGACY = {good:1, firm:1, soft:2, yielding:2, hard:3, bad:4, heavy:4};
const GROUND_MODERN = {good:1, firm:1, yielding:2, soft:3, hard:3, heavy:4, bad:4};
const GROUND_NAME = {1:'Firm', 2:'Good', 3:'Soft', 4:'Heavy'};
const SEASON_NAME = {1:'Spring', 2:'Summer', 3:'Fall', 4:'Winter'};
const WEATHER_NAME = {1:'Sunny', 2:'Cloudy', 3:'Rainy', 4:'Snow'};
const STYLE_NAME = {1:'Front', 2:'Pace', 3:'Late', 4:'End'};
const GRADES = {1:'G', 2:'F', 3:'E', 4:'D', 5:'C', 6:'B', 7:'A', 8:'S'};

const SEASON_KEYS  = ['season', 'Season', '<Season>k__BackingField'];
const WEATHER_KEYS = ['weather', 'Weather', '<Weather>k__BackingField'];
const GROUND_KEYS  = ['ground_condition', 'groundCondition', 'GroundCondition',
                      '<GroundCondition>k__BackingField'];
const HORSE_KEYS   = ['race_horse_data_array', 'raceHorseDataArray', '<RaceHorse>k__BackingField',
                      'raceHorse', 'horses'];
const TEAM_KEYS    = ['team_id', 'teamId', 'TeamId'];

function enumValue(raw, labels){
  const n = Number(raw);
  if (Number.isInteger(n)) return n;
  return typeof raw === 'string' ? labels[raw.trim().toLowerCase()] ?? null : null;
}

function isLegacy(cap){
  return Array.isArray(val(cap, ['raceHorse', '<RaceHorse>k__BackingField']))
    && (cap.simDataBase64 !== undefined || cap['<SimDataBase64>k__BackingField'] !== undefined);
}

function conditions(cap){
  return {
    season: enumValue(val(cap, SEASON_KEYS), SEASON),
    weather: enumValue(val(cap, WEATHER_KEYS), WEATHER),
    ground: enumValue(val(cap, GROUND_KEYS), isLegacy(cap) ? GROUND_LEGACY : GROUND_MODERN),
  };
}

function courseId(cap){
  const set = val(cap, ['race_course_set', 'raceCourseSet', 'RaceCourseSet',
                        '<RaceCourseSet>k__BackingField']);
  const id = set ? val(set, ['id', 'Id', 'course_id', 'courseId', '<Id>k__BackingField'])
                 : val(cap, ['course_id', 'courseId', 'CourseId']);
  return Number.isInteger(Number(id)) ? Number(id) : null;
}

const unwrap = h => val(h, ['_responseHorseData', 'responseHorseData']) ?? h;

const APT_FIELDS = ['ground_turf', 'ground_dirt', 'distance_short', 'distance_mile',
                    'distance_middle', 'distance_long', 'running_style_nige',
                    'running_style_senko', 'running_style_sashi', 'running_style_oikomi'];

function aptitudes(h){
  const out = {};
  for (const field of APT_FIELDS) out[field] = Number(val(h, ['proper_' + field])) || 0;
  return out;
}

/* When a runner was finished. The client keeps it on the trainee record as an obfuscated field:
   `hiddenValue` is the UTF-16 bytes of "YYYY-MM-DD HH:MM:SS" — every second byte a zero — each
   character XORed with `currentCryptoKey` cycled over its index. */
function trainedOn(entry){
  const trained = val(entry, ['trainedCharaData', '<TrainedCharaData>k__BackingField',
                              '_trainedCharaData']);
  const time = val(trained, ['createTime', '<CreateTime>k__BackingField']);
  const key = val(time, ['currentCryptoKey']);
  const raw = val(time, ['hiddenValue']);
  if (typeof key !== 'string' || !key || !Array.isArray(raw) || !raw.length) return '';
  const wide = raw.length > 1 && raw.every((b, i) => i % 2 === 1 ? b === 0 : true);
  const bytes = wide ? raw.filter((_, i) => i % 2 === 0) : raw;
  const text = bytes.map((b, i) => String.fromCharCode(b ^ key.charCodeAt(i % key.length))).join('');
  return /^\d{4}-\d{2}-\d{2}/.test(text) ? text.slice(0, 10) : '';
}

/* ---- one runner ---------------------------------------------------------------------------------

A member of a team, in the one shape the rest of the page uses, whether it was read out of a race
capture or out of the veterans file. Everything a runner races with is in here, which is what
lets a team lifted out of one room be grafted into another. */

// The six support cards the trainee was raised on. They are not part of a member's signature,
// but they are what a runner is read by.
function supportsOf(entry){
  const trained = val(entry, ['trainedCharaData', '<TrainedCharaData>k__BackingField',
                              '_trainedCharaData']);
  const list = val(trained, ['supportCardArray', '<SupportCardArray>k__BackingField',
                             'support_card_array']);
  if (!Array.isArray(list)) return [];
  return list.map(card => ({
      slot: Number(val(card, ['position', '<Position>k__BackingField'])) || 0,
      id: Number(val(card, ['supportCardId', '<SupportCardId>k__BackingField',
                            'support_card_id'])) || 0,
      lb: Number(val(card, ['limitBreakCount', '<LimitBreakCount>k__BackingField',
                            'limit_break_count'])) || 0,
    }))
    .filter(card => card.id)
    .sort((a, b) => a.slot - b.slot)
    .map(card => [card.id, card.lb]);
}

// How many of the six came out of the gacha, and how many copies of those that is: one per card
// plus one per limit break, out of thirty.
const rankScoreOf = entry => {
  const trained = val(entry, ['trainedCharaData', '<TrainedCharaData>k__BackingField',
                              '_trainedCharaData']);
  return Number(val(trained, ['rankScore', 'rank_score', '<RankScore>k__BackingField'])) || 0;
};

const ssrOf = m => (m.sup || []).filter(([id]) => SUPPORT[id]?.[3]).length;
const bkOf = m => (m.sup || []).reduce((total, [id, lb]) =>
  total + (SUPPORT[id]?.[3] ? lb + 1 : 0), 0);

/* Which racers are ones the game really holds: the signature of every runner in the uploads and
   every trained character in the veterans file. A racer is real only if it is one of those down
   to the last field — restyle it or hand it a skill and it is a racer nobody ever trained, which
   is the same thing a pasted code is. The set is rebuilt lazily so that it is first read after
   the store has been recalled, and dropped whenever what is loaded changes.

   The signature is the team key's: id, rank score, support cards and creation date are not in
   it. A code that
   happens to describe a veteran field for field therefore reads as that veteran. */
let REAL = null;
const realSigs = () => REAL || (REAL = new Set(
  VETS.map(memberSig).concat(...RACES.map(race => race.runners.map(memberSig)))));
const fakeRacer = member => !realSigs().has(memberSig(member));

function memberOf(h){
  const card = Number(val(h, ['card_id', 'cardId'])) || 0;
  const named = CARDS[card] || ['', 'Chara ' + card];
  const skills = (val(h, ['skill_array', 'skillArray']) || [])
    .map(s => [Number(val(s, ['skill_id', 'skillId'])) || 0, Number(val(s, ['level'])) || 1])
    .filter(([id]) => id);
  return {
    card, ti: named[0], na: named[1],
    id: Number(val(h, ['trained_chara_id', 'trainedCharaId'])) || 0,
    rarity: Number(val(h, ['rarity'])) || 0,
    talent: Number(val(h, ['talent_level', 'talentLevel'])) || 1,
    fans: Number(val(h, ['fan_count', 'fanCount', 'fans'])) || 0,
    speed: Number(val(h, ['speed'])) || 0, stamina: Number(val(h, ['stamina'])) || 0,
    power: Number(val(h, ['pow', 'power'])) || 0, guts: Number(val(h, ['guts'])) || 0,
    wiz: Number(val(h, ['wiz'])) || 0,
    style: Number(val(h, ['running_style', 'runningStyle'])) || 0,
    skills, apt: aptitudes(h), sup: [], ct: '',
    sp: skills.reduce((total, [id]) => total + (SKILLS[id]?.[3] || 0), 0),
  };
}

function runners(cap){
  const list = val(cap, HORSE_KEYS);
  if (!Array.isArray(list)) return [];
  return list.map(entry => {
    const h = unwrap(entry);
    const member = memberOf(h);
    member.ct = trainedOn(entry);
    member.sup = supportsOf(entry);
    member.rs = rankScoreOf(entry);
    return Object.assign(member, {
      team: Number(val(h, TEAM_KEYS)),
      gate: Number(val(h, ['frame_order', 'frameOrder']) ?? 0),
      trainer: String(val(h, ['trainer_name', 'trainerName']) || ''),
    });
  });
}

function teamNames(list){
  const names = {};
  for (const r of list) if (r.trainer && !names[r.team]) names[r.team] = r.trainer;
  return names;
}

function teamsOf(list){
  const byId = new Map();
  for (const r of list){
    if (!byId.has(r.team)) byId.set(r.team, []);
    byId.get(r.team).push(r);
  }
  for (const group of byId.values()) group.sort((a, b) => a.gate - b.gate);
  return [...byId.entries()].sort((a, b) => a[0] - b[0])
    .map(([id, members]) => ({id, members}));
}

/* ---- the veterans file ----------------------------------------------------------------------

A flat array of trained characters. A runner's fields are in here under the same names a race
capture uses, bar `power`, which is `pow` in a race, so `memberOf` reads either. */

function vetOf(v){
  const member = memberOf(v);
  return Object.assign(member, {
    rs: Number(v.rank_score) || 0,
    ct: String(v.create_time || '').slice(0, 10),
    sup: (v.support_card_list || []).slice()
      .sort((a, b) => (a.position || 0) - (b.position || 0))
      .map(c => [Number(c.support_card_id) || 0, Number(c.limit_break_count) || 0])
      .filter(([id]) => id),
    hay: norm(member.ti + ' ' + member.na),
    // Searched alongside the name, so "corner ad" finds everyone who has Corner Adept.
    sk_hay: skillHay(member.skills),
  });
}

const skillHay = skills => norm(skills.map(([id]) => SKILLS[id]?.[0] || '').join(' '));
const hayOf = vet => vet.hay + ' ' + (vet.sk_hay || '');

const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

function tokenMatch(hay, query, strict){
  const words = hay.split(' ');
  return query.split(' ').every(t => words.some(w => w.startsWith(t))
    || (!strict && (hay.replace(/ /g, '').includes(t) || hay.includes(t))));
}

function search(items, hayOf, query){
  const strict = items.filter(i => tokenMatch(hayOf(i), query, true));
  return strict.length ? strict : items.filter(i => tokenMatch(hayOf(i), query, false));
}

// Every skill in the game, once, for the add-a-skill search: rarest first, so a query that
// catches both a gold skill and its white version offers the gold one first.
const SKILL_LIST = Object.entries(SKILLS)
  .map(([id, row]) => ({id: Number(id), name: row[0], rarity: row[1], debuff: row[2],
                        points: row[3] || 0, hay: norm(row[0])}))
  .sort((a, b) => b.rarity - a.rarity || a.name.localeCompare(b.name));

/* ---- a team is identified by its three runners ----------------------------------------------------

A team is identified by what it is rather than by where it came from: a team built in tab 1 and
the same three runners seen in an upload are one team, and the order they were picked in is not
part of it. No lineage is kept — a team edited into another is simply another team — but the
runners stay visible: results are recorded per runner as well as per team, so they can be broken
down and grouped across teams later. So the key is a hash of the three member signatures sorted, and the members are
held in that same sorted order — which, debuffers aside, is also the order they take the vacant
slot's gates in, so that one team in one room is always the same request and always the same cache
entry.

The trainee id, the fan count and who trained it are not in the signature, so the same three
runners out of two different accounts are one team. */

const sig32 = text => {
  const fnv = seed => {
    let h = seed;
    for (let i = 0; i < text.length; i++){
      h ^= text.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h.toString(16).padStart(8, '0');
  };
  return fnv(0x811c9dc5) + fnv(0x9dc5811c) + text.length.toString(36);
};

const memberSig = m => [m.card, m.speed, m.stamina, m.power, m.guts, m.wiz, m.style,
  APT_FIELDS.map(f => m.apt[f] || 0).join('.'),
  m.skills.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(s => s.join('.')).join(',')
].join('|');

// The order the three are held in — which, debuffers aside, is also the order they take the
// vacated gates in — is the order of a hash of each signature, not of the signature itself. Sorting on the signature
// would sort on its first field, the card id, and so hand the lowest gate to the lowest card id
// every time; hashing first scatters that. It is still fixed: the same three runners are always
// ordered the same way, whatever they are put up against.
const memberRank = m => sig32(memberSig(m));

function teamOf(members, source){
  const list = members.map(m => ({...m})).sort((a, b) => {
    const x = memberRank(a), y = memberRank(b);
    return x < y ? -1 : x > y ? 1 : 0;
  });
  return {
    key: 'T' + sig32(list.map(memberSig).join(';')),
    members: list, source,
    label: list.map(m => m.na).join(' · '),
    stats: ['speed', 'stamina', 'power', 'guts', 'wiz']
      .map(f => list.reduce((t, m) => t + m[f], 0)),
    sp: list.reduce((t, m) => t + (m.sp || 0), 0),
  };
}

/* ---- grafting a team into a room ----------------------------------------------------------------

Replacing a runner means rewriting its response data. The trainee record beside it is left alone
and only the response is grafted.

What is kept from the runner being replaced: gate, team, team member id, motivation, popularity and
the field's ordering — the gate only as where it starts from, in a meeting whose gates are drawn
again for each race. What comes from the incoming member: who it is, its five stats, its skills,
its aptitudes and its running style. */

/* The skills a runner actually takes into a race, which is not always the list it is carrying.
   The game takes a rung away when it sells the one above: a gold replaces the white it is
   bought over, as a ◎ replaces the ○. A runner out of a capture is already like that, but a list
   built here can hold both, off an older racer code or a skill put on by hand, and racing that
   would field a horse the game cannot make. So the rungs that were bought over come off on the
   way into the request, whatever the list was built out of. */
function raceSkills(member){
  const list = member.skills || [];
  const under = new Set(list.map(([id]) => NEEDS[id]).filter(Boolean));
  return under.size ? list.filter(([id]) => !under.has(id)) : list;
}

const GRAFT = [
  ['card_id', m => m.card], ['chara_id', m => Math.floor(m.card / 100)],
  ['race_dress_id', m => m.card], ['rarity', m => m.rarity], ['talent_level', m => m.talent],
  ['trained_chara_id', m => m.id], ['single_mode_chara_id', m => m.id],
  ['speed', m => m.speed], ['stamina', m => m.stamina], ['pow', m => m.power],
  ['guts', m => m.guts], ['wiz', m => m.wiz],
  ['running_style', m => m.style], ['fan_count', m => m.fans],
  ['skill_array', m => raceSkills(m).map(([id, level]) => ({skill_id: id, level}))],
  ...APT_FIELDS.map(f => ['proper_' + f, m => m.apt[f] || 0]),
];

/* Whether a runner is a debuffer: a third or more of its skills debuffs, or a debuffer enabler
   with every gold skill a debuff. */
const DEBUFFER_ENABLERS = new Set([110071, 910071]);
function isDebuffer(member){
  const ids = raceSkills(member).map(([id]) => id);
  if (!ids.length) return false;
  if (ids.filter(id => SKILLS[id]?.[2]).length / ids.length >= 1 / 3) return true;
  if (!ids.some(id => DEBUFFER_ENABLERS.has(id))) return false;
  const gold = ids.filter(id => SKILLS[id]?.[1] === 2);
  return gold.length > 0 && gold.every(id => SKILLS[id]?.[2]);
}

/* Which incoming member takes each vacated slot, the slots in gate order. A debuffer takes a gate
   a debuffer left and the rest take the rest, as far as the two teams allow; whoever is left over
   fills what is left. Either way the team's canonical order meets the gates lowest first, so a
   team with no debuffer, into a room whose team had none, fills them exactly in that order.
   Where the gates are drawn again for each race none of this decides anything, and the team
   fills the slots in its canonical order. */
function pairing(slotFlags, memberFlags){
  const pick = slotFlags.map(() => -1), used = new Set();
  const take = (slot, ok) => {
    const at = memberFlags.findIndex((flag, i) => !used.has(i) && ok(flag));
    if (at >= 0){ pick[slot] = at; used.add(at); }
  };
  slotFlags.forEach((flag, slot) => take(slot, f => f === flag));
  slotFlags.forEach((_, slot) => { if (pick[slot] < 0) take(slot, () => true); });
  return pick;
}

function withTeam(cap, teamId, members, randomGates){
  const holder = HORSE_KEYS.find(k => Array.isArray(cap[k]));
  if (!holder) return cap;
  const list = cap[holder].slice();
  // The team fills the vacated gates lowest first, debuffers into the gates debuffers left.
  const slots = list.map((entry, index) => [index, unwrap(entry)])
    .filter(([, h]) => Number(val(h, TEAM_KEYS)) === teamId)
    .sort((a, b) => Number(val(a[1], ['frame_order', 'frameOrder']) ?? 0)
                  - Number(val(b[1], ['frame_order', 'frameOrder']) ?? 0));
  const pick = randomGates ? members.map((_, i) => i)
    : pairing(slots.map(([, h]) => isDebuffer(memberOf(h))), members.map(isDebuffer));
  slots.forEach(([index], slot) => {
    const member = members[pick[slot]];
    if (!member) return;
    const horse = {...list[index]};
    const where = horse._responseHorseData !== undefined ? '_responseHorseData'
      : horse.responseHorseData !== undefined ? 'responseHorseData' : null;
    const data = where ? {...horse[where]} : {...horse};
    for (const [field, pick] of GRAFT) data[field] = pick(member);
    if (where) horse[where] = data; else Object.assign(horse, data);
    list[index] = horse;
  });
  return {...cap, [holder]: list};
}

/* ---- the request --------------------------------------------------------------------------- */

function replaceValues(target, keys, fallback, value){
  let replaced = false;
  for (const key of keys) if (Object.prototype.hasOwnProperty.call(target, key)){
    target[key] = value;
    replaced = true;
  }
  if (!replaced) target[fallback] = value;
}

// The race's own recorded seed, so the request is reproducible — which is what lets the answer be
// cached. One arrangement is one batch of 100; the page offers no second batch and no other seed.
// `randomizedGates` goes only into the requests of a meeting that has it, so every other
// meeting's requests are the ones its results were filed under.
function requestBody(race, cap){
  const capture = {...cap};
  replaceValues(capture, SEASON_KEYS, 'season', race.season);
  replaceValues(capture, WEATHER_KEYS, 'weather', race.weather);
  replaceValues(capture, GROUND_KEYS, 'groundCondition', race.ground);
  return {capture, courseId: race.courseId, grade: 100, time: 2,
          raceCount: RACE_COUNT, seed: race.seed,
          ...meetingOf(race)?.randomGates ? {randomizedGates: true} : {}};
}

const bodyFor = (room, subject) => requestBody(room.race,
  subject.key === room.out.key ? room.race.cap
    : withTeam(room.race.cap, room.outId, subject.members, !!meetingOf(room.race)?.randomGates));

/* ---- state ------------------------------------------------------------------------------------ */

const RACES = [];
let VETS = [];
let VETS_AT = 0;                   // when the veterans file was last dropped, ms; 0 unknown
let ROOMS = [];
let SEQ = 0;

const state = {
  tab: 'teams',
  cm: MEETINGS[MEETINGS.length - 1].id,   // the meeting chosen in the bar; a visit opens on the latest
  byCm: {},                        // the other meetings' staged teams and picks, by meeting id
  vq: '', vsort: 'ct', racedFirst: true, more: 0, aim: null, stale: false,
  slots: [null, null, null], styles: [null, null, null],
  skills: [null, null, null], sq: ['', '', ''],  // per slot: an edited skill list, and its search
  apts: [null, null, null],        // per slot: aptitudes changed from the template's, by field
  teams: [],                       // staged in tab 1, kept in localStorage
  hidden: new Set(),               // staged teams kept, but out of the other tabs' way
  player: '', off: new Set(),      // rooms switched off, by room key
  picked: new Set(), base: true,   // what tab 3 will run
  noTeams: false,                  // a view over the ticks, never a write to them
  minRaces: 5,                     // most of the teams in an upload are seen once
  noFront: false,                  // a view over the ticks, never a write to them
  lastN: 0,                        // the last this many rows of the Rooms list, another; 0 is off
  compact: false,                  // rooms drawn with their runners on one line
  govMax: 4,
  govSpan: 65000,
  running: false, stop: false, note: '', armed: false, ready: false,
  open: '',
  roomRunners: new Map(),          // on the Rooms tab, the runner open in each team, by room:team
  runners: new Set(),               // racers opened on the Simulate tab, any number at once
  stagedOpen: new Set(),           // staged teams unfolded onto their runners, any number at once
  stagedArmed: '',                 // the staged team whose delete has been asked for once
  stagedReady: false,              // and whether its dead time has run out
};

/* The slot contents as a team would see them. A slot is not a veteran but a racer invented for
   this team out of one: the veteran is the template it started from, and the style, skills and
   aptitudes it is given ride beside the slot, so the veterans file is only ever read and no other
   team built from the same template is touched. Skill points follow the list they are the cost
   of. */
const slotMembers = () => state.slots.map((vet, i) => {
  if (!vet) return vet;
  const style = state.styles[i] && state.styles[i] !== vet.style ? state.styles[i] : vet.style;
  const skills = state.skills[i] || vet.skills;
  const apt = state.apts[i] ? {...vet.apt, ...state.apts[i]} : vet.apt;
  if (style === vet.style && skills === vet.skills && apt === vet.apt) return vet;
  return {...vet, style, skills, apt,
          sp: skills.reduce((total, [id]) => total + (SKILLS[id]?.[3] || 0), 0)};
});

// The grades a runner carries that its template does not, or null when there are none.
function aptOverrides(apt, template){
  const out = {};
  for (const field of APT_FIELDS){
    const grade = Number(apt?.[field]);
    if (grade >= 1 && grade <= 8 && grade !== (template?.[field] || 0)) out[field] = grade;
  }
  return Object.keys(out).length ? out : null;
}

// Two skill lists are the same list whatever order they are in.
const sameSkills = (a, b) => a.length === b.length
  && a.map(sk => sk.join('.')).sort().join(',') === b.map(sk => sk.join('.')).sort().join(',');

// Which of your veterans ran in a loaded race. A trainee id is numbered per account, so an
// opponent's id can collide with one of yours: only runners under the chosen trainer name count,
// and the card has to agree as well.
// How many of the loaded races each of the player's own trained characters ran in.
let RACED = new Map();
const ranHere = vet => RACED.has(vet.id + ':' + vet.card);
const racedCount = vet => RACED.get(vet.id + ':' + vet.card) || 0;

function racedIds(){
  RACED = new Map();
  for (const race of RACES) for (const r of race.runners)
    if (r.id && r.trainer && r.trainer === state.player){
      const key = r.id + ':' + r.card;
      RACED.set(key, (RACED.get(key) || 0) + 1);
    }
}

/* ---- races into rooms ---------------------------------------------------------------------------

A room is an uploaded race with one team lifted out of it. Which team: the one fielded by the
trainer name that appears in the most races, which is whoever saved these captures. What is left —
the other two teams, the course, the conditions and the seed — is the reference the page races
against, and the team that was lifted out is the room's own baseline. */

/* A capture carries no clock: `time` is Daytime or Night, and the filename holds only a date.
   What does carry one is the file itself, so the moment it was saved is read off the drop and
   kept with the race. */
function normalise(cap, name, saved){
  const list = runners(cap);
  const {season, weather, ground} = conditions(cap);
  const seedRaw = Number(val(cap, ['random_seed', 'randomSeed', 'RandomSeed',
                                   '<RandomSeed>k__BackingField']));
  const race = {
    key: 'r' + (++SEQ), name, cap, saved: Number(saved) || 0,
    courseId: courseId(cap), season, weather, ground,
    seed: Number.isInteger(seedRaw) && seedRaw >= -2147483648 && seedRaw <= 2147483647
      ? seedRaw : null,
    runners: list, teams: teamsOf(list), names: teamNames(list),
  };
  race.why = raceWhy(race);
  return race;
}

function raceWhy(race){
  if (!meetingOf(race)) return `Not a ${MEETINGS.map(m => m.label).join(' or ')} race`;
  if (race.seed === null) return 'No usable random seed';
  if (race.runners.length !== 9 || race.teams.length !== 3
      || race.teams.some(t => t.members.length !== 3)) return 'Not a 3v3v3 race';
  return '';
}

// The name that fields a team in the most races, which is almost always the person whose captures
// these are.
function commonName(){
  const count = new Map();
  for (const race of RACES)
    for (const team of race.teams){
      const name = race.names[team.id];
      if (name) count.set(name, (count.get(name) || 0) + 1);
    }
  return [...count.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))[0]?.[0] || '';
}

// Most-raced first: the name that fields a team in the most captures is almost always the one
// to take out, and the rest are opponents seen once each.
const playerNames = () => {
  const count = new Map();
  for (const race of RACES) for (const team of race.teams){
    const name = race.names[team.id];
    if (name) count.set(name, (count.get(name) || 0) + 1);
  }
  return [...count.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([name, n]) => [name, n]);
};

const meeting = () => MEETINGS.find(m => m.id === state.cm) || MEETINGS[MEETINGS.length - 1];

function rebuildRooms(){
  ROOMS = [];
  for (const race of RACES){
    const of = meetingOf(race);
    if (of && of !== meeting()) continue;
    const room = {key: '', raceKey: race.key, race, name: race.name.replace(/\.json$/i, ''),
                  saved: race.saved, index: ROOMS.length,
                  outId: null, out: null, opp: [], teams: [], why: race.why, on: false};
    ROOMS.push(room);
    if (race.why) continue;
    const out = race.teams.find(t => race.names[t.id] === state.player);
    if (!out){ room.why = `${state.player || 'That trainer'} is not in this race`; continue; }
    room.outId = out.id;
    room.teams = race.teams.map(t => Object.assign(teamOf(t.members, 'raced'),
      {teamId: t.id, trainer: race.names[t.id] || '', gates: t.members.map(m => m.gate)}));
    room.out = room.teams.find(t => t.teamId === out.id);
    room.opp = room.teams.filter(t => t.teamId !== out.id);
    // The room is the two opponents plus the shape of the race they were in. Two captures of the
    // same matchup on different seeds are two rooms, because they are two questions.
    room.key = 'R' + sig32(JSON.stringify({
      c: race.courseId, s: race.season, w: race.weather, g: race.ground, seed: race.seed,
      opp: room.opp.map(t => t.key).sort(),
      gates: race.runners.map(r => r.team + ':' + r.gate).sort().join(','),
      out: room.outId,
    }));
    room.on = !state.off.has(room.key);
  }
  /* A room's name on the page: its place in the list counted down from the top, R01 the first
     row, usable rooms only. Ticks and filters do not move it, so a column on the Simulate tab
     is called the same thing whichever rooms are in the distribution. */
  const usable = ROOMS.filter(room => !room.why);
  const width = Math.max(2, String(usable.length).length);
  usable.forEach((room, i) => { room.tag = 'R' + String(i + 1).padStart(width, '0'); });
}

/* Nobody left at the front: with the subtracted team gone, neither opponent ran the Front
   style, so whatever fills the vacancy makes the pace itself. */
const frontless = room => room.opp.every(team => team.members.every(m => m.style !== 1));

// The rooms ticked into the distribution. What the page runs is these, narrowed by whatever
// sub-filter is switched on — a narrowing that never writes to the ticks, so switching it off
// gives the distribution back exactly as it was.
const tickedRooms = () => ROOMS.filter(r => !r.why && r.on);

/* The day a capture was taken, as its own file name gives it: eight digits from this century.
   The file's modified time is not the same thing: a file copied or restored carries the day it
   was copied. A name with no date in it reads as empty. */
const roomDate = room => (String(room.name || '').match(/(?:^|\D)(20\d{6})(?:\D|$)/) || [])[1] || '';

/* The latest captures, which are the top rows of the Rooms list: the list runs newest first.
   Counted over every row it draws — ticked or not, usable or not, and before any other filter
   has had its say — so "last 10" is the same ten rows whatever else is switched on, and the
   rooms it keeps are the ticked ones among them. */
const LAST_CHOICES = [5, 10, 15, 20, 30, 40];
const lastKeeps = room => !state.lastN || room.index < state.lastN;

// Whether the sub-filters let a ticked room through. A room they hold back keeps its tick.
const subKeeps = r => (!state.noFront || frontless(r)) && lastKeeps(r);

const activeRooms = () => tickedRooms().filter(subKeeps);

// Every team ever seen in an upload, most-raced first. These are the ready-made subjects: the
// opponents themselves, and your own team as it was fielded.
/* Every team ever seen in an upload, most-raced first. Teams seen the same number of times go
   newest first, on whatever recency the captures carry: the moment a capture was saved where
   there is one, and the day in its file name where there is not. A team in no dated capture at
   all falls back to its name, so the order is still fixed rather than whatever the files were
   read in. */
function racedTeams(){
  const seen = new Map();
  for (const room of ROOMS){
    if (room.why) continue;
    const saved = room.saved || 0;
    const day = roomDate(room);
    for (const team of room.teams){
      const found = seen.get(team.key);
      if (found){
        found.n++;
        if (saved > found.last) found.last = saved;
        if (day > found.day) found.day = day;
        if (team.trainer && !found.trainers.includes(team.trainer)) found.trainers.push(team.trainer);
      } else seen.set(team.key, Object.assign(teamOf(team.members, 'raced'),
        {n: 1, last: saved, day, trainers: team.trainer ? [team.trainer] : []}));
    }
  }
  return [...seen.values()].sort((a, b) => b.n - a.n
    || b.last - a.last
    || b.day.localeCompare(a.day)
    || a.label.localeCompare(b.label));
}

/* A team staged in tab 1 that also raced in an upload is one team, not two, and the staged copy
   speaks for it — in the place the raced one already held. Staging never moves a tile that is
   already on the page: a team that raced keeps its rank by appearances, and one invented in tab 1
   has no rank to take, so it goes on the end in the order it was staged. Anything ticked stays
   where it is when the next team is staged. */
const subjectsAll = () => {
  // A staged team that is hidden is still staged; it is simply not one of the teams the other
  // tabs are about, so it is left out here and comes back the moment it is shown again.
  const raced = racedTeams().filter(t => !state.hidden.has(t.key));
  const ranked = new Set(raced.map(t => t.key));
  const staged = new Map(state.teams.map(t => [t.key, t]));
  const out = raced.map(t => staged.has(t.key) ? {...staged.get(t.key), n: t.n,
                                                  last: t.last, day: t.day,
                                                  trainers: t.trainers} : t);
  return [...out, ...state.teams
    .filter(t => !ranked.has(t.key) && !state.hidden.has(t.key))
    .map(t => ({...t, n: 0}))];
};
const subjectOf = key => subjectsAll().find(t => t.key === key) || null;
/* What the Teams tab can copy: a subject, or an uploaded team held out of the other tabs, which
   is on that tab's list and nowhere in the subjects. */
const copyableOf = key => state.teams.find(t => t.key === key) || subjectOf(key)
  || racedTeams().find(t => t.key === key) || null;

/* Most teams in a set of uploads are seen once — they are one room's opponents and nothing else
   — so the Simulate tab shows only the ones seen often enough, plus anything staged or already
   picked. That list is also what the all-teams button acts over: it runs what the tab is
   showing, not the hundred teams the filter is keeping out of the way. */
const shownSubjects = () => subjectsAll().filter(team => team.source === 'staged'
  || state.picked.has(team.key) || (team.n || 0) >= state.minRaces);

/* Which teams will run. The button is a view over the ticks and never a write to them: while it
   is on no team runs at all, and when it goes off the ticks are exactly where they were. */
const chosenSubjects = () => state.noTeams
  ? [] : subjectsAll().filter(t => state.picked.has(t.key));

/* ---- where simulated results live -------------------------------------------------------------

Every batch is filed under a digest of the exact request that produced it, and a room
configuration with an answer is never asked again. The store is localStorage, one key an entry.

Entries are deflated: nearly all of one is per-runner skill counts under the same few key names,
which compress well entry by entry. Entries written before this are plain JSON and are read as
they are; each is deflated the next time it is written.

The page reads the cache synchronously all over: a tile asks whether its room has an answer while
it is being drawn. Inflating is not synchronous, so the store is read and inflated once at load
into a Map, and every read after that is against the Map. A write goes into the Map at once and is
deflated and stored in the background. Only the page's own boot has to wait, which is what
RESULT_READY is for.

What none of this buys is durability: the browser may evict the lot when the disk runs short. It
is a cache of things that can be run again, and it is worth what a cache is worth. Results worth
keeping belong in a file, which is what the Results tab's download is for. */

// Every prefix the store reads: what a page finds is its own, what it counts is all.
const RESULT_PREFIXES = ['room_sim.v1.', 'race_sim.v1.', 'vet_sim.v1.'];
// What a deflated entry looks like. JSON always opens with a brace, so one control character in
// front of the bytes is enough to tell the two forms apart for good.
const ZIP_MARK = '\u0001';

const RESULT_MIRROR = new Map();    // the whole store, inflated, read once at load
// A page that wants to say something when a write is refused sets this.
let onStoreTrouble = null;

const CAN_ZIP = typeof CompressionStream === 'function'
  && typeof DecompressionStream === 'function';

const throughZip = async (bytes, how) => new Uint8Array(await new Response(
  new Blob([bytes]).stream().pipeThrough(new how('deflate-raw'))).arrayBuffer());

const deflate = async entry => throughZip(
  new TextEncoder().encode(JSON.stringify(entry)), CompressionStream);
const inflate = async bytes =>
  JSON.parse(new TextDecoder().decode(await throughZip(bytes, DecompressionStream)));

/* localStorage holds strings and Chromium counts its ceiling in UTF-16 units, so a byte to a unit
   costs a quarter less than base64 would and needs no alphabet. Every byte is below 256, which is
   a code unit that survives the round trip unchanged. */
const toBinary = bytes => {
  let text = '';
  for (const byte of bytes) text += String.fromCharCode(byte);
  return text;
};
const fromBinary = text => Uint8Array.from(text, c => c.charCodeAt(0));

// What one stored string means, in either form.
async function entryOf(raw){
  if (typeof raw !== 'string' || !raw) return null;
  if (!raw.startsWith(ZIP_MARK)) return JSON.parse(raw);
  return CAN_ZIP ? inflate(fromBinary(raw.slice(1))) : null;
}

/* The whole store into the Map. An entry that will not inflate or parse is left where it is and
   counted, rather than thrown away: it costs its own space and nothing else, and deleting a
   result this page merely failed to read is how a cache loses things it was keeping. */
async function bootResultStore(){
  const keys = [];
  try {
    for (let i = 0; i < localStorage.length; i++){
      const key = localStorage.key(i);
      if (key && RESULT_PREFIXES.some(prefix => key.startsWith(prefix))) keys.push(key);
    }
  } catch {
    console.info('results: localStorage is not readable here; nothing is cached this session');
    return {held: 0, bad: 0};
  }
  let bad = 0;
  for (const key of keys){
    let entry = null;
    try { entry = await entryOf(localStorage.getItem(key)); } catch { entry = null; }
    if (entry) RESULT_MIRROR.set(key, entry);
    else bad++;
  }
  if (bad) console.warn(`results: ${bad} of ${keys.length} stored entries did not read back`);
  return {held: RESULT_MIRROR.size, bad};
}

/* One entry to the store. Deflating is not synchronous, so the write happens after the call that
   asked for it has returned; the Map already has the entry, so nothing on screen waits for it. A
   refused write is the one failure that matters — the batch was run and paid for — so it is said
   out loud rather than only logged. */
async function writeResult(key, entry){
  let value;
  try { value = CAN_ZIP ? ZIP_MARK + toBinary(await deflate(entry)) : JSON.stringify(entry); }
  catch { value = JSON.stringify(entry); }
  try {
    localStorage.setItem(key, value);
  } catch (reason) {
    console.warn('results: could not store one', reason);
    onStoreTrouble?.('This browser will not store any more results — it is out of room, and '
      + 'anything run now will have to be run again.');
  }
}

/* ---- what a page calls ----------------------------------------------------------------------
   Synchronous, by full key. Every read is the Map, which holds the store as it was at load and
   everything written since. */

const resultGet = key => RESULT_MIRROR.get(key) ?? null;

function resultSet(key, entry){
  RESULT_MIRROR.set(key, entry);
  void writeResult(key, entry);
  return true;
}

function resultDrop(key){
  RESULT_MIRROR.delete(key);
  try { localStorage.removeItem(key); } catch {}
}

// [full key, entry] for everything under one prefix, which is how a page finds its own.
const resultPairs = prefix => [...RESULT_MIRROR].filter(([key]) => key.startsWith(prefix));

// Started as the page is parsed, waited on before the page's first read.
const RESULT_READY = bootResultStore();

/* ---- the cache ----------------------------------------------------------------------------------

One entry is one team in one room: a 100-race batch, filed under a digest of the exact request
body that produced it. A room configuration that has an entry is cached and is never submitted
again — that is the whole of this page's idea of caching, and it is why every request is pinned to
the capture's own seed.

An entry carries what it was, not just what came back, so the Results tab can be read on a later
visit with no captures loaded at all: the team, the room, who was taken out of it.

A room run with the team that actually raced there is filed a second time, under the baseline
prefix and entry shape.

Where the entries sit is the part above: localStorage, deflated, read into memory at load. */

const CACHE = 'room_sim.v1.';
const BASE_CACHE = 'race_sim.v1.';
let INDEX = null;

function cacheAll(){
  if (INDEX) return INDEX;
  INDEX = resultPairs(CACHE).map(([, entry]) => entry)
    .filter(entry => entry && entry.subject && entry.room && Array.isArray(entry.teams));
  INDEX.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  return INDEX;
}

// The results of the meeting chosen in the bar, which is all any tab shows or acts on.
const cacheHere = () => cacheAll().filter(entry => sameMeeting(entry.room, meeting()));

const cacheGet = (prefix, key) => resultGet(prefix + key);

function cacheSet(prefix, key, value){
  const entry = {...value, key};
  // A refused write is the one failure that matters — the batch was run and paid for — and the
  // store says so through `onStoreTrouble` rather than only logging it.
  resultSet(prefix + key, entry);
  if (prefix === CACHE && INDEX){
    const at = INDEX.findIndex(other => other.key === key);
    if (at < 0) INDEX.push(entry); else INDEX[at] = entry;
  }
  return entry;
}

/* Results nobody can ask for again: those of a team staged here and since deleted. A team that
   raced in a loaded capture is still a subject, so its results stay even if its staged copy went. */
function orphaned(){
  const live = new Set([...state.teams, ...racedTeams()].map(t => t.key));
  return cacheHere().filter(e => e.subject.source === 'staged' && !live.has(e.subject.key));
}

/* Made room for, not lost by accident: this is only ever asked for from the Results tab, twice.
   A baseline is filed twice, once under the baseline prefix, and left there it would be adopted straight
   back into this page's cache the next time its cell is looked up — so both copies go. */
function dropResults(entries){
  const gone = new Set(entries.map(e => e.key));
  for (const e of entries){
    resultDrop(CACHE + e.key);
    if (e.baseline) resultDrop(BASE_CACHE + e.key);
  }
  INDEX = null;
  for (const cell of CELLS.values()) if (cell.entry && gone.has(cell.entry.key)) cell.entry = null;
  $('err').textContent = `${entries.length} result${entries.length === 1 ? '' : 's'} deleted`;
  render();
}

async function digest(text){
  if (crypto?.subtle?.digest){
    const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
  }
  return sig32(text);
}

// What the entry says about the team that was asked about.
const rateOf = entry => entry?.teams?.find(t => Number(t.teamId) === entry.subjectTeamId)?.winRate ?? null;
const winsOf = entry => entry?.teams?.find(t => Number(t.teamId) === entry.subjectTeamId)?.wins ?? null;

// A result carries enough of its runners to be grouped by later — by character, by style, by
// stat, by skill — without the capture or the veterans file being loaded again. The batch's own
// per-runner win counts are kept beside them, in `runners`.
const packed = m => [m.card, m.style, m.speed, m.stamina, m.power, m.guts, m.wiz, m.sp || 0,
                     m.skills.map(([id]) => id)];

const describe = (room, subject) => ({
  subject: {key: subject.key, label: subject.label, source: subject.source,
            members: subject.members.map(packed)},
  subjectTeamId: room.outId,
  baseline: subject.key === room.out.key,
  room: {key: room.key, name: room.name, saved: room.saved || 0,
         courseId: room.race.courseId, seed: room.race.seed,
         season: room.race.season, weather: room.race.weather, ground: room.race.ground,
         out: {key: room.out.key, label: room.out.label, trainer: room.out.trainer},
         opp: room.opp.map(t => ({key: t.key, label: t.label, trainer: t.trainer,
                                  teamId: t.teamId}))},
});

/* ---- the request log ------------------------------------------------------------------------

Every submission attempt is recorded: when it was made, whether it was accepted, what the queue
said, and how long the job took. The log survives reloads, up to the newest 200 records: an older
one goes as each new one comes in, and a longer log kept from before is cut to that on load. */

const LOG_KEY = 'room_sim.log.v1';
const LOG_MAX = 200;
let RLOG = [];

function logLoad(){
  try { RLOG = JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch { RLOG = []; }
  if (!Array.isArray(RLOG)) RLOG = [];
  if (RLOG.length > LOG_MAX){ RLOG.splice(0, RLOG.length - LOG_MAX); logSave(); }
}

function logSave(){
  try { localStorage.setItem(LOG_KEY, JSON.stringify(RLOG)); } catch {}
}

const sentWithin = (span, at) =>
  RLOG.filter(r => r.kind === 'submit' && at - r.t <= span && r.t < at).length;

function logAdd(rec){
  RLOG.push(rec);
  if (RLOG.length > LOG_MAX) RLOG.splice(0, RLOG.length - LOG_MAX);
  logSave();
  if (state.tab === 'sim') renderLog();
  return rec;
}

function logSubmit(fields){
  const t = fields.t || Date.now();
  return logAdd({kind: 'submit', ...fields, t,
                 in60: sentWithin(60000, t), in600: sentWithin(600000, t)});
}

function logStats(){
  const submits = RLOG.filter(r => r.kind === 'submit');
  const ok = submits.filter(r => r.ev === 'ok');
  const bad = submits.filter(r => r.ev !== 'ok');
  const gaps = list => list.map(r => r.gap).filter(g => Number.isFinite(g) && g >= 0);
  const median = list => {
    if (!list.length) return null;
    const s = [...list].sort((a, b) => a - b);
    return s[Math.floor(s.length / 2)];
  };
  const codes = new Map();
  for (const r of bad) codes.set(r.status || r.ev, (codes.get(r.status || r.ev) || 0) + 1);
  let busiest = 0, busiestBad = 0, busiest45 = 0;
  for (const r of submits){
    const n = submits.filter(o => o.t <= r.t && r.t - o.t < 60000);
    if (n.length > busiest){
      busiest = n.length;
      busiestBad = n.filter(o => o.ev !== 'ok').length;
    }
    busiest45 = Math.max(busiest45,
      submits.filter(o => o.t <= r.t && r.t - o.t < 45000).length);
  }
  const runs = submits.map(r => r.run).filter(Number.isFinite);
  return {
    n: submits.length, ok: ok.length, bad: bad.length,
    codes: [...codes.entries()].sort((a, b) => b[1] - a[1]),
    okGap: gaps(ok).length ? Math.min(...gaps(ok)) : null,
    okGapMid: median(gaps(ok)),
    badGap: gaps(bad).length ? Math.max(...gaps(bad)) : null,
    badIn60: bad.length ? Math.min(...bad.map(r => r.in60 ?? 0)) : null,
    busiest, busiestBad, busiest45,
    run: runs.length ? Math.round(runs.reduce((a, b) => a + b, 0) / runs.length) : null,
    ahead: Math.max(0, ...submits.map(r => r.ahead || 0)),
    polls: RLOG.filter(r => r.kind === 'poll').length,
    first: submits.length ? submits[0].t : null,
  };
}

/* ---- what the page remembers ------------------------------------------------------------------

Of the veterans file, the rows as read are kept rather than the file as delivered. Staged teams
are kept whole, members and all, so a team survives the veterans file being replaced by a later
one. Race captures are not kept: choosing which ones to open is the point of the page. */

const STORE = 'room_sim.store.v1';
const VET_SIM_STORE = 'vet_sim.store.v1';

/* The notes typed on the Simulate tab, one line a team, by team key, so a team keeps its note
   whichever meeting it is staged in and whatever is staged or picked. They are kept apart from
   the store above, which carries the veterans file, so a keystroke writes only the notes. */
const NOTES_STORE = 'room_sim.notes.v1';
let NOTES = {};
try {
  const kept = JSON.parse(localStorage.getItem(NOTES_STORE) || 'null');
  if (isRecord(kept)) NOTES = kept;
} catch {}

function setNote(key, text){
  if (text) NOTES[key] = text; else delete NOTES[key];
  try { localStorage.setItem(NOTES_STORE, JSON.stringify(NOTES)); }
  catch (reason) { console.warn('room_sim: could not store the notes', reason); }
}

function remember(){
  try {
    localStorage.setItem(STORE, JSON.stringify({
      vets: VETS, vetsAt: VETS_AT, player: state.player,
      // A veteran is kept by its id and read back out of the file; a racer pasted in as a code
      // is in no file, so it is kept whole.
      slots: state.slots.map(v => v && (v.id || v)),
      styles: state.styles, skills: state.skills, apts: state.apts,
      byCm: Object.fromEntries(Object.entries(
        {...state.byCm, [state.cm]: {teams: state.teams, picked: state.picked}})
        .map(([id, kept]) => [id, {teams: kept.teams, picked: [...kept.picked]}])),
      base: state.base, off: [...state.off],
      hidden: [...state.hidden],
      minRaces: state.minRaces, noFront: state.noFront, compact: state.compact,
      lastN: state.lastN,
      noTeams: state.noTeams,
      govMax: state.govMax, govSpan: state.govSpan,
    }));
  } catch (reason) { console.warn('room_sim: could not store the veterans file', reason); }
}

function recall(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch {}
  if (!saved){
    try { saved = JSON.parse(localStorage.getItem(VET_SIM_STORE) || 'null'); } catch {}
    if (saved) console.info('room_sim: adopted the veterans file vet_sim.html had stored');
  }
  if (!saved) return;
  VETS = Array.isArray(saved.vets) ? saved.vets : [];
  VETS_AT = Number(saved.vetsAt) || 0;
  state.player = saved.player || '';
  const staged = list => (Array.isArray(list) ? list : [])
    .filter(t => t && Array.isArray(t.members) && t.members.length === 3)
    .map(t => teamOf(t.members, 'staged'));
  const keys = list => new Set(Array.isArray(list) ? list : []);
  /* Kept from before the meetings were kept apart, a staged team goes to each meeting it has
     results in, and one with results in neither goes to both, so nothing staged drops out of
     sight. Picks went with the teams they named, so they go to both. */
  const ran = (key, m) => cacheAll().some(e => e.subject.key === key && sameMeeting(e.room, m));
  const per = {};
  for (const m of MEETINGS){
    const kept = isRecord(saved.byCm) ? saved.byCm[m.id] : null;
    per[m.id] = isRecord(saved.byCm)
      ? {teams: staged(kept?.teams), picked: keys(kept?.picked)}
      : {teams: staged(saved.teams).filter(t => ran(t.key, m)
                                       || !MEETINGS.some(other => ran(t.key, other))),
         picked: keys(saved.picked)};
  }
  state.teams = per[state.cm].teams;
  state.picked = per[state.cm].picked;
  delete per[state.cm];
  state.byCm = per;
  state.hidden = new Set(Array.isArray(saved.hidden) ? saved.hidden : []);
  if (Number.isFinite(saved.govMax)) state.govMax = Math.min(6, Math.max(1, saved.govMax));
  if (Number.isFinite(saved.govSpan))
    state.govSpan = Math.min(GOVERNOR.ceiling, Math.max(5000, saved.govSpan));
  GOVERNOR.max = state.govMax;
  GOVERNOR.base = GOVERNOR.span = state.govSpan;
  state.base = saved.base !== false;
  if (Number.isFinite(saved.minRaces)) state.minRaces = saved.minRaces;
  state.noFront = saved.noFront === true;
  state.lastN = LAST_CHOICES.includes(saved.lastN) ? saved.lastN : 0;
  state.compact = saved.compact === true;
  state.noTeams = saved.noTeams === true;
  state.off = new Set(Array.isArray(saved.off) ? saved.off : []);
  for (const vet of VETS){
    if (vet.sk_hay === undefined) vet.sk_hay = skillHay(vet.skills || []);
    if (vet.hay === undefined) vet.hay = norm((vet.ti || '') + ' ' + (vet.na || ''));
    // Rows kept by an older page have no date and no skill point total; both are in the file.
    if (vet.ct === undefined){ vet.ct = ''; state.stale = true; }
    if (vet.sp === undefined)
      vet.sp = (vet.skills || []).reduce((total, [id]) => total + (SKILLS[id]?.[3] || 0), 0);
    if (vet.power === undefined && vet.pow !== undefined) vet.power = vet.pow;
  }
  state.slots = [0, 1, 2].map(i => {
    const kept = (saved.slots || [])[i];
    if (kept && typeof kept === 'object') return kept;
    return VETS.find(v => v.id === kept) || null;
  });
  state.styles = [0, 1, 2].map(i => (saved.styles || [])[i] || null);
  state.apts = [0, 1, 2].map(i =>
    aptOverrides({...state.slots[i]?.apt, ...(saved.apts || [])[i]}, state.slots[i]?.apt));
  state.skills = [0, 1, 2].map(i => {
    const list = (saved.skills || [])[i];
    return Array.isArray(list)
      ? list.map(sk => [Number(sk[0]) || 0, Number(sk[1]) || 1]).filter(([id]) => id) : null;
  });
}

/* ---- loading ------------------------------------------------------------------------------------

One drop zone takes all three kinds of file. A capture is an object with a field of runners. The
other two are bare arrays, told apart by what is in them: a veterans file holds trained
characters, a results file holds the rows the Results tab writes out, each naming the team and
the room it measured. */

async function addFiles(files){
  const problems = [];
  let brought = 0;
  for (const file of files){
    let raw;
    try { raw = JSON.parse(await file.text()); }
    catch { problems.push(`${file.name}: not valid JSON`); continue; }
    if (Array.isArray(raw)){
      const results = raw.filter(v => v && v.subject && v.subject.key
                                   && v.room && v.room.key && Array.isArray(v.teams));
      if (results.length){
        for (const entry of results) IMPORTED.set(importedId(entry.subject, entry.room), entry);
        brought += results.length;
        continue;
      }
      const rows = raw.filter(v => v && v.card_id !== undefined).map(vetOf);
      if (!rows.length){ problems.push(`${file.name}: no trained characters in that array`); continue; }
      VETS = rows;
      VETS_AT = Date.now();
      state.stale = false;
      continue;
    }
    if (!isRecord(raw)){ problems.push(`${file.name}: not a race capture`); continue; }
    const race = normalise(raw, file.name, file.lastModified);
    if (!race.runners.length){ problems.push(`${file.name}: no runners in this file`); continue; }
    if (RACES.some(other => other.name === race.name && other.seed === race.seed)) continue;
    RACES.push(race);
  }
  IMPORT_SAID = {brought, problems};
  if (!state.player || !playerNames().some(([name]) => name === state.player))
    state.player = commonName();
  reground();
}

// Everything downstream of which races are loaded and whose team comes out of them.
function reground(){
  REAL = null;
  racedIds();
  rebuildRooms();
  CELLS.clear();
  remember();
  render();
  // Imports are filed first: a cell prices once and keeps what it found, so an entry arriving
  // after would not be seen until something cleared the cells again.
  void fileImported().then(price);
}

/* ---- the plan ------------------------------------------------------------------------------------

A cell is one team in one room: the request it would make, the digest that request is filed under,
and whatever is already filed there. Rows are the teams tab 3 has picked, plus — when it is on —
the "as raced" row, whose subject in each room is the team that was taken out of that room, so it
reproduces the uploaded race and gives the reference distribution its own baseline. */

const CELLS = new Map();
const cellId = (subject, room) => subject.key + '|' + room.key;

const planRows = () => [
  ...(state.base ? [{kind: 'base', key: 'BASE', label: 'As raced'}] : []),
  ...chosenSubjects().map(team => ({kind: 'team', key: team.key, label: team.label, team})),
];

const subjectFor = (row, room) => row.kind === 'base' ? room.out : row.team;

function cellGet(subject, room){ return CELLS.get(cellId(subject, room)) || null; }

// The entry already held for a cell: this page's own, or — for a room run as it was raced — the
// one filed under the baseline prefix for the same request, adopted into this page's shape.
function lookup(cell){
  const found = cacheGet(CACHE, cell.digest);
  if (found) return found;
  if (cell.subject.key !== cell.room.out.key) return null;
  const old = cacheGet(BASE_CACHE, cell.digest);
  if (!old || !Array.isArray(old.teams)) return null;
  return cacheSet(CACHE, cell.digest, {
    ...describe(cell.room, cell.subject),
    teams: old.teams, runners: old.runners || [], engine: old.engine || '',
    races: old.races || RACE_COUNT, seedStart: old.seedStart, seeds: old.seeds ?? null,
    at: old.at || '', ts: old.ts || Date.now(), from: 'race_sim',
  });
}

/* Results saved out of the Results tab and dropped back on the page. They are held by team and
   room rather than by digest, because a digest is over the exact request body and the file does
   not carry one: what is taken from the file is the measurement, and everything that says what
   was measured is rebuilt from the room and the subject in front of us. So an entry lands under
   the digest this page would have filed it under, and a file dropped before the captures waits
   here until the room it belongs to exists.

   Files written before the export carried its runners have none, so a room restored from one
   shows what each team scored and nothing per runner. */
const IMPORTED = new Map();
const importedId = (subject, room) => subject.key + '|' + room.key;

/* A file written by this page carries the digest it was filed under, which is the whole of what
   a key is, and the description that was filed with it. So it goes straight back where it came
   from: no capture loaded, no room, no team, nothing to hash. */
const importedWhole = found => ({
  subject: found.subject, subjectTeamId: found.subjectTeamId, baseline: !!found.baseline,
  room: found.room,
  teams: found.teams, runners: Array.isArray(found.runners) ? found.runners : [],
  engine: found.engine || '', races: found.races || RACE_COUNT,
  seedStart: found.seedStart, seeds: found.seeds ?? null,
  at: found.at || '', ts: found.ts || Date.now(), from: 'import',
});

// A file from before exports carried their key: the description is there but the digest is not,
// so it has to be earned back from the room and the team this page has in front of it.
const importedEntry = (found, room, subject) => ({
  ...describe(room, subject),
  teams: found.teams, runners: Array.isArray(found.runners) ? found.runners : [],
  engine: found.engine || '', races: found.races || RACE_COUNT,
  seedStart: found.seedStart, seeds: found.seeds ?? null,
  at: found.at || '', ts: found.ts || Date.now(), from: 'import',
});

/* What the last drop did, said once the entries are filed rather than when the file was read:
   filing has to hash a request body apiece, so the drop itself has no count to report yet. */
let IMPORT_SAID = null;

function sayImport(filed){
  if (!IMPORT_SAID) return;
  const {brought, problems} = IMPORT_SAID;
  IMPORT_SAID = null;
  const said = [];
  if (brought) said.push(`${filed} of ${brought} saved result${brought === 1 ? '' : 's'} filed`
    + (IMPORTED.size ? `, ${IMPORTED.size} waiting for their room or team` : ''));
  if (problems.length) said.push(problems.join(' · '));
  $('err').textContent = said.join(' · ');
}

/* Everything a dropped file named, filed under the digest this page would have given it — every
   room and team in the file, not only the ones that happen to be picked. The key is a digest of
   the whole request body, so one has to be built and hashed apiece, which is the same work
   pricing does and the reason this is asynchronous.

   A file this page wrote since keys were exported needs none of that: it says which digest each
   entry belongs under, so it is filed as it stands. Only an older file has to be worked out, and
   then two things stop an entry: its room is not loaded, or its team has never been seen here.
   Neither can have a request body built for it. Those wait in case the capture that names them
   is dropped next. */
async function fileImported(){
  if (!IMPORTED.size){ sayImport(0); return; }
  const rooms = new Map(ROOMS.filter(room => !room.why).map(room => [room.key, room]));
  const subjects = new Map(subjectsAll().map(team => [team.key, team]));
  let filed = 0;
  for (const [id, found] of [...IMPORTED]){
    if (typeof found.key === 'string' && found.key && found.subjectTeamId !== undefined){
      if (!cacheGet(CACHE, found.key)) cacheSet(CACHE, found.key, importedWhole(found));
      IMPORTED.delete(id);
      filed++;
      continue;
    }
    const room = rooms.get(found.room.key);
    if (!room) continue;
    // The team that was taken out of a room is that room's own subject, and it is a team like
    // any other, but a file may name it before the uploads it appears in have been read.
    const subject = subjects.get(found.subject.key)
      || (room.out && room.out.key === found.subject.key ? room.out : null);
    if (!subject) continue;
    const key = await digest(JSON.stringify(bodyFor(room, subject)));
    // A result already held is the one that was run here; a file does not overwrite it.
    if (!cacheGet(CACHE, key)) cacheSet(CACHE, key, importedEntry(found, room, subject));
    IMPORTED.delete(id);
    filed++;
  }
  sayImport(filed);
}

let PRICING = 0;

// Each cell's request is costly to build and hash, so it is done once and kept.
async function price(){
  const run = ++PRICING;
  // In the order the run takes them, so a run started early has its first rooms ready.
  for (const room of activeRooms()) for (const row of planRows()){
    if (run !== PRICING) return;
    const subject = subjectFor(row, room);
    if (!subject) continue;
    const id = cellId(subject, room);
    if (!CELLS.has(id)) CELLS.set(id, {id, subject, room, digest: '', entry: null, note: '', busy: ''});
    const cell = CELLS.get(id);
    if (cell.digest) continue;
    cell.digest = await digest(JSON.stringify(bodyFor(room, subject)));
    cell.entry = lookup(cell);
  }
  if (run !== PRICING) return;
  renderPlan();
  renderBar();
  renderTabs();
  // Pricing adopts baselines filed under the baseline prefix into this page's cache, so results
  // can gain rows.
  renderResults();
}

// Room by room: every team in R01, then every team in R02, so a run finishes rooms as it goes.
const planCells = () => {
  const out = [];
  for (const room of activeRooms()) for (const row of planRows()){
    const subject = subjectFor(row, room);
    const cell = subject && cellGet(subject, room);
    if (cell) out.push(cell);
  }
  return out;
};

const todoCells = () => {
  const seen = new Set();
  return planCells().filter(cell => {
    if (cell.entry || seen.has(cell.id)) return false;
    seen.add(cell.id);
    return true;
  });
};

/* ---- running ------------------------------------------------------------------------------------ */

let ACTIVE = null;

const uuid = () => crypto.randomUUID ? crypto.randomUUID()
  : `room-sim-${Date.now()}-${Math.random().toString(36).slice(2)}`;

async function readBatch(response){
  const payload = await response.json().catch(() => ({}));
  if (!response.ok){
    const error = new Error(payload.error || `HTTP ${response.status}`);
    error.status = response.status;
    const after = Number(response.headers.get('Retry-After'));
    if (Number.isFinite(after) && after > 0) error.retryAfter = Math.min(after, 300) * 1000;
    throw error;
  }
  if (typeof payload.jobId !== 'string' || typeof payload.status !== 'string'
      || !payload.links || typeof payload.links.heartbeat !== 'string'
      || typeof payload.links.cancel !== 'string')
    throw new Error('The simulator returned an incomplete batch response.');
  return payload;
}

const ACTIVE_STATUS = new Set(['queued', 'running', 'cancel_requested']);

// A wait that says what it is waiting for and gives up the moment Stop is pressed.
async function waitFor(ms, label){
  const until = Date.now() + ms;
  while (!state.stop){
    const left = until - Date.now();
    if (left <= 0) return;
    if (label){
      state.note = `${label} ${Math.ceil(left / 1000)}s`;
      renderBar();
    }
    await new Promise(resolve => setTimeout(resolve, Math.min(500, left)));
  }
}

const retryable = reason => RETRY_STATUS.has(reason?.status)
  || reason?.status === undefined && reason instanceof TypeError   // the fetch never landed
  || /rate limit|too many|1015/i.test(reason?.message || '');

const sentIn = span => {
  const now = Date.now();
  return SENT.filter(t => now - t < span).length;
};

function holdFor(){
  const now = Date.now();
  const recent = SENT.filter(t => now - t < GOVERNOR.span).sort((a, b) => a - b);
  if (recent.length < GOVERNOR.max) return 0;
  return Math.max(0, recent[recent.length - GOVERNOR.max] + GOVERNOR.span - now) + 250;
}

async function submit(text, what){
  for (let attempt = 0; ; attempt++){
    const asked = Date.now();
    for (let hold = holdFor(); hold > 0; hold = holdFor()){
      await waitFor(hold, 'pacing');
      if (state.stop) return null;
    }
    const gap = SENT.length ? Date.now() - SENT[SENT.length - 1] : null;
    const started = Date.now();
    const held = started - asked;
    const win = sentIn(GOVERNOR.span);
    SENT.push(started);
    if (SENT.length > 200) SENT.splice(0, SENT.length - 200);
    try {
      const job = await readBatch(await fetch(API + '/api/races/resimulate/batches', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Idempotency-Key': uuid()},
        body: text,
      }));
      if (++GOVERNOR.streak >= GOVERNOR.clean && GOVERNOR.span > GOVERNOR.base){
        GOVERNOR.span = Math.max(GOVERNOR.base, Math.round(GOVERNOR.span * 0.9));
        GOVERNOR.streak = 0;
      }
      return {job, log: logSubmit({t: started, ev: 'ok', gap, held, attempt, what, win,
        span: GOVERNOR.span, accept: Date.now() - started, pos: job.queue?.position ?? null,
        ahead: job.queue?.racesAhead ?? null, job: job.jobId})};
    } catch (reason) {
      const refused = reason?.status === 429 || /rate limit|too many|1015/i.test(reason?.message || '');
      logSubmit({t: started, ev: reason?.status ? 'refused' : 'error', status: reason?.status ?? null,
        msg: String(reason?.message || reason).slice(0, 120), gap, held, attempt, what, win,
        span: GOVERNOR.span, accept: Date.now() - started,
        retryAfter: reason?.retryAfter ?? null});
      if (attempt >= RETRIES || !retryable(reason)) throw reason;
      if (refused){
        GOVERNOR.span = Math.min(GOVERNOR.ceiling, Math.round(GOVERNOR.span * 1.25));
        GOVERNOR.streak = 0;
        console.warn('room_sim: refused, widening the window', {span: GOVERNOR.span, reason});
        if (reason.retryAfter) await waitFor(reason.retryAfter, 'queue refused, waiting');
      } else {
        await waitFor(2000 * (attempt + 1), 'retrying');
      }
      if (state.stop) return null;
    }
  }
}

// Which seeds the batch says it ran: a consecutive run from seedStart collapses to its start and
// length, anything else is kept whole.
function seedsUsed(batch){
  const races = batch.results?.races;
  if (!Array.isArray(races) || !races.length) return null;
  const list = [...races].sort((a, b) => (a.index ?? 0) - (b.index ?? 0)).map(r => r.seed);
  if (list.every((seed, i) => seed === list[0] + i) && list[0] === batch.seedStart)
    return {start: list[0], count: list.length};
  return {start: list[0], count: list.length, list};
}

// One batch, start to finish. Returns the results, or null if it failed or was stopped.
async function batch(cell){
  const text = JSON.stringify(bodyFor(cell.room, cell.subject));
  const what = `${cell.subject.label} @ ${cell.room.name}`.slice(0, 90);
  const out = await submit(text, what);
  if (!out) return null;
  let job = out.job;
  if (!job.accessToken) throw new Error('The simulator did not return a batch access token.');
  ACTIVE = {cancel: link(job.links.cancel), accessToken: job.accessToken};
  const started = Date.now();
  let errors = 0;
  while (ACTIVE_STATUS.has(job.status)){
    if (state.stop){ void cancelActive(); return null; }
    await new Promise(resolve => setTimeout(resolve, POLL_MS));
    try {
      const response = await fetch(link(job.links.heartbeat), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({accessToken: job.accessToken}),
      });
      job = await readBatch(response);
      errors = 0;
      cell.busy = job.queue && job.status === 'queued'
        ? `queue ${job.queue.position ?? '?'}` : `${job.completedRaces ?? 0}/${RACE_COUNT}`;
      if (job.queue?.racesAhead) out.log.ahead = Math.max(out.log.ahead || 0, job.queue.racesAhead);
      renderPlan();
    } catch (reason) {
      console.warn(`room_sim: heartbeat ${errors + 1} failed`, {job: job.jobId, reason});
      logAdd({kind: 'poll', t: Date.now(), ev: reason?.status ? 'refused' : 'error',
        status: reason?.status ?? null, msg: String(reason?.message || reason).slice(0, 120),
        attempt: errors, what, job: job.jobId});
      if (++errors <= POLL_TOLERANCE){
        if (retryable(reason)) await waitFor(reason.retryAfter || 1500 * errors, 'queue busy');
        continue;
      }
      const said = reason instanceof Error ? reason.message : '';
      throw new Error(/not found/i.test(said) ? 'the queue lost this job'
        : said || 'Lost contact with the batch queue.');
    }
  }
  ACTIVE = null;
  out.log.run = Date.now() - started;
  out.log.done = job.status;
  logSave();
  if (job.status !== 'completed' || !job.results)
    throw new Error(job.error || `batch ${job.status}`);
  return job;
}

async function cancelActive(){
  const active = ACTIVE;
  ACTIVE = null;
  if (!active) return;
  try {
    await fetch(active.cancel, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({accessToken: active.accessToken}),
    });
  } catch {}
}

function store(cell, job){
  const common = {
    teams: job.results.teams || [], runners: job.results.runners || [],
    engine: job.results.engineBuild || '', races: job.totalRaces || RACE_COUNT,
    seedStart: job.seedStart, seeds: seedsUsed(job),
    at: new Date().toISOString().slice(0, 10), ts: Date.now(),
  };
  // A room raced by the team that was in it is filed under the baseline prefix as well.
  if (cell.subject.key === cell.room.out.key)
    cacheSet(BASE_CACHE, cell.digest, {...common, base: cell.digest, swaps: [], styles: {}, batch: 0});
  return cacheSet(CACHE, cell.digest, {...describe(cell.room, cell.subject), ...common});
}

/* The batches a run has still to submit, and the one it is on. The plan can be changed while a
   run is going; the queue is only brought in line with it when that is asked for, and the batch
   already submitted is left to finish either way. A batch this run has already tried and
   lost is not a change to the plan: it waits for the next Run, as it did before. */
let QUEUE = null, CURRENT = null, TRIED = new Set(), DONE = 0;

const queueWanted = () => todoCells().filter(cell => cell !== CURRENT && !TRIED.has(cell));

function queueStale(){
  if (!QUEUE) return false;
  const want = queueWanted(), left = QUEUE.filter(cell => !cell.entry);
  return want.length !== left.length || want.some((cell, i) => cell !== left[i]);
}

function queueNote(done){
  const cell = CURRENT;
  state.note = `batch ${done + 1} of ${done + 1 + QUEUE.length}`
    + (cell ? ` · ${cell.subject.label} @ ${cell.room.name}` : '');
}

function queueUpdate(){
  if (!state.running || state.stop || !queueStale()) return;
  QUEUE = queueWanted();
  queueNote(DONE);
  renderPlan(); renderBar();
}

async function runPlan(){
  QUEUE = todoCells();
  if (!QUEUE.length){ QUEUE = null; return; }
  state.running = true; state.stop = false; state.note = '';
  render();
  DONE = 0; TRIED = new Set();
  while (QUEUE.length){
    if (state.stop) break;
    const cell = QUEUE.shift();
    // Queued before its pricing finished, or filled in by a drop since: settle both here.
    if (!cell.digest){
      cell.digest = await digest(JSON.stringify(bodyFor(cell.room, cell.subject)));
      cell.entry = lookup(cell);
    }
    if (cell.entry) continue;
    CURRENT = cell; TRIED.add(cell);
    cell.busy = 'SUB'; cell.note = '';
    queueNote(DONE);
    renderPlan(); renderBar();
    try {
      const job = await batch(cell);
      if (job) cell.entry = store(cell, job);
    } catch (reason) {
      cell.note = reason instanceof Error ? reason.message : 'Batch simulation failed.';
      console.warn('room_sim: batch failed', {cell: cell.id, reason});
    }
    cell.busy = '';
    CURRENT = null;
    DONE++;
    // The badges move with the batch that just landed: one fewer to run, one more result. They
    // were being left until the run finished, which read as a counter that never changed. The
    // team tiles are the same figures, rooms run and the rate over them, wherever they are drawn.
    renderPlan(); renderBar(); renderTabs();
    renderSubjects(); renderStaged(); renderCopy();
  }
  await cancelActive();
  for (const cell of CELLS.values()) cell.busy = '';
  QUEUE = null; CURRENT = null;
  state.running = false; state.note = '';
  render();
}
